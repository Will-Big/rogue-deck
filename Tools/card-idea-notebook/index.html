<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fate Weaver 카드 아이디어 노트</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #eee9df;
      --muted: #a8a196;
      --dim: #746f68;
      --paper: #171917;
      --panel: #1f221f;
      --panel-2: #272a26;
      --line: #3a3e38;
      --line-strong: #555b51;
      --gold: #d9b86c;
      --gold-bright: #f0cf7c;
      --ally: #79a9c7;
      --enemy: #c97b72;
      --danger: #e18a80;
      --success: #87b98b;
      --warning: #ddb36a;
      --shadow: 0 18px 50px rgba(0, 0, 0, .28);
      font-family: Inter, Pretendard, "Noto Sans KR", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 1080px;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% -5%, rgba(217, 184, 108, .10), transparent 27rem),
        linear-gradient(150deg, #111310 0%, #181a17 54%, #111310 100%);
    }

    button, input, select, textarea { font: inherit; }

    button {
      border: 1px solid var(--line-strong);
      border-radius: 9px;
      padding: 9px 13px;
      color: var(--ink);
      background: #2c302a;
      cursor: pointer;
      transition: border-color .15s ease, background .15s ease, transform .15s ease;
    }

    button:hover:not(:disabled) {
      border-color: var(--gold);
      background: #363a32;
    }

    button:active:not(:disabled) { transform: translateY(1px); }
    button:disabled { opacity: .4; cursor: not-allowed; }
    button.primary { color: #1b1a15; border-color: var(--gold); background: var(--gold); font-weight: 750; }
    button.primary:hover:not(:disabled) { background: var(--gold-bright); }
    button.danger { color: #ffd9d4; border-color: #734942; background: #412a27; }
    button.ghost { background: transparent; }

    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 10px 11px;
      color: var(--ink);
      outline: none;
      background: #161815;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(217, 184, 108, .10);
    }

    textarea { min-height: 92px; resize: vertical; line-height: 1.55; }
    label { display: grid; gap: 7px; color: #d6d1c8; font-size: 13px; font-weight: 700; }

    .app-header {
      height: 78px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 0 24px;
      border-bottom: 1px solid var(--line);
      background: rgba(20, 22, 19, .92);
      backdrop-filter: blur(16px);
    }

    .brand { display: flex; align-items: center; gap: 13px; }
    .brand-mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border: 1px solid #715e35;
      border-radius: 11px;
      color: var(--gold-bright);
      background: linear-gradient(145deg, #393221, #211f18);
      box-shadow: inset 0 0 20px rgba(217, 184, 108, .08);
      font-size: 20px;
    }

    h1, h2, h3, p { margin: 0; }
    h1 { font-family: Georgia, "Noto Serif KR", serif; font-size: 20px; letter-spacing: -.02em; }
    .subtitle { margin-top: 3px; color: var(--muted); font-size: 12px; }

    .workspace {
      height: calc(100vh - 78px);
      display: grid;
      grid-template-columns: minmax(250px, .72fr) minmax(480px, 1.35fr) minmax(360px, 1fr);
      gap: 1px;
      background: var(--line);
    }

    .pane {
      min-width: 0;
      overflow: hidden;
      background: var(--paper);
    }

    .pane-scroll {
      height: 100%;
      overflow: auto;
      scrollbar-color: #555b51 #1a1c19;
    }

    .pane-header {
      position: sticky;
      top: 0;
      z-index: 3;
      min-height: 66px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background: rgba(31, 34, 31, .96);
      backdrop-filter: blur(14px);
    }

    .pane-title { display: flex; align-items: center; gap: 9px; font-size: 14px; }
    .editor-actions { display: flex; align-items: center; gap: 8px; }
    .count {
      min-width: 25px;
      padding: 2px 7px;
      border-radius: 999px;
      color: var(--muted);
      background: #161815;
      text-align: center;
      font-size: 11px;
    }

    .library-tools { padding: 14px 14px 10px; }

    .library-pane {
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
    }
    .library-pane > .pane-scroll {
      min-height: 0;
      height: auto;
    }

    .preview-pane { background: #131512; }
    .json-preview {
      min-height: calc(100vh - 145px);
      margin: 0;
      padding: 18px;
      border: 1px solid #2f332e;
      border-radius: 12px;
      color: #d8d4cb;
      background: #0d0f0d;
      box-shadow: var(--shadow);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font: 12px/1.65 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .diff-row { display: block; white-space: pre-wrap; }
    .diff-row.is-add { color: #9ede9e; background: rgba(80, 160, 80, .12); }
    .diff-row.is-remove { color: #e8a0a0; background: rgba(180, 70, 70, .12); }
    .diff-row.is-same { color: #8a8a80; }
    #repo-source-toggle.is-active { color: #1b1a15; border-color: var(--gold); background: var(--gold); }

    dialog {
      width: min(440px, calc(100vw - 40px));
      border: 1px solid var(--line-strong);
      border-radius: 15px;
      padding: 0;
      color: var(--ink);
      background: var(--panel);
      box-shadow: 0 28px 90px rgba(0, 0, 0, .6);
    }
    dialog::backdrop { background: rgba(5, 6, 5, .72); backdrop-filter: blur(4px); }
    .dialog-body { padding: 22px; }
    .dialog-body h2 { margin-bottom: 10px; font: 19px Georgia, "Noto Serif KR", serif; }
    .dialog-body p { color: var(--muted); line-height: 1.65; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 18px; border-top: 1px solid var(--line); }
    #repo-export-dialog .dialog-body { min-width: 420px; max-height: 62vh; overflow: auto; }
    .export-line { margin: 0 0 8px; color: var(--gold-bright); font-size: 13px; }
    .export-group { margin: 0 0 10px; }
    .export-group h3 { margin: 0 0 4px; font-size: 12px; color: #cfc9b6; }
    .export-group ul { margin: 0; padding-left: 18px; color: #9a958a; font-size: 12px; }
    .export-blocked { margin: 0 0 8px; color: #e8a0a0; font-size: 12px; }
    .export-notice { margin: 0 0 8px; color: var(--gold-bright); font-size: 12px; }

    .mode-button { padding: 6px 12px; font-size: 12px; }
    .mode-button.is-active { color: #1b1a15; border-color: var(--gold); background: var(--gold); }
    .repo-hint { margin-bottom: 8px; color: var(--warning); font-size: 12px; line-height: 1.5; }
    .repo-list { display: grid; gap: 7px; padding: 0 10px 10px; }
    .repo-summary { padding: 14px 16px; border-bottom: 1px solid var(--line); font-size: 13px; }
    .repo-summary p { margin: 0 0 4px; color: var(--muted); }
    .repo-detail { padding: 14px 16px; }
    .repo-problems { padding: 0 16px 14px; display: grid; gap: 6px; }
    .repo-problem {
      display: grid;
      gap: 2px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #191b18;
      text-align: left;
      font-size: 12px;
      line-height: 1.5;
    }
    .repo-problem .where { color: var(--muted); font-size: 11px; }
    .repo-problem.is-error { border-color: var(--danger); }
    .repo-problem.is-warning { border-color: var(--warning); }
    .repo-tabs { display: flex; gap: 4px; margin-bottom: 10px; }
    .repo-entry {
      display: grid;
      gap: 3px;
      width: 100%;
      padding: 9px 11px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--panel);
      text-align: left;
      font-size: 12px;
      line-height: 1.5;
    }
    .repo-entry.is-selected { border-color: var(--gold); }
    .repo-entry .headline { display: flex; justify-content: space-between; gap: 8px; }
    .repo-entry .headline .id { color: var(--muted); font-size: 11px; }
    .repo-entry .meta { color: var(--muted); font-size: 11px; }
    .repo-entry .badge { font-size: 11px; }
    .repo-entry .badge.is-conflict { color: var(--danger); }
    .repo-entry .badge.is-modified,
    .repo-entry .badge.is-new { color: var(--warning); }
    .repo-entry .badge.is-error { color: var(--danger); }
    .repo-fields { display: grid; gap: 6px; font-size: 13px; }
    .repo-fields div { display: flex; gap: 10px; }
    .repo-fields dt { min-width: 84px; color: var(--muted); }
    .pool-section { margin-top: 16px; }
    .pool-section h4 { margin-bottom: 8px; color: var(--muted); font-size: 12px; }
    .pool-roster { display: grid; gap: 5px; font-size: 12px; }
    .pool-roster .slot {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr) auto auto;
      gap: 8px;
      align-items: center;
      padding: 6px 9px;
      border: 1px solid var(--line);
      border-radius: 9px;
    }
    .pool-roster .slot.is-missing { border-color: var(--danger); color: var(--danger); }
    .pool-roster .slot .index { color: var(--dim); }
    .pool-roster .slot .tail { color: var(--muted); font-size: 11px; }
    .pool-distribution { display: grid; gap: 6px; font-size: 12px; }
    .pool-distribution div { display: flex; gap: 10px; }
    .pool-distribution dt { min-width: 48px; color: var(--muted); }
    .repo-header-actions { display: flex; gap: 6px; }
    .repo-form { display: grid; gap: 10px; }
    .repo-form label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
    .repo-form input,
    .repo-form select { padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px;
      color: var(--ink); background: #191b18; }
    .repo-form .row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .repo-readonly { color: var(--warning); font-size: 12px; line-height: 1.6; }
    .repo-raw-editor { display: grid; gap: 8px; }
    .repo-raw-editor textarea {
      min-height: 340px; padding: 10px; border: 1px solid #3a3a33; border-radius: 6px;
      background: #161815; color: #ded9c8;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; line-height: 1.55;
    }
    .repo-raw-error { margin: 0; color: #e8a0a0; font-size: 12px; }
    .repo-conflict {
      display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
      margin: 0 0 10px; padding: 9px 11px;
      border: 1px solid #8a5a2a; border-radius: 6px; background: rgba(160, 100, 40, .14);
      color: #e8c79a; font-size: 12px;
    }
    .repo-conflict strong { color: var(--gold-bright); }
    .effect-list { display: grid; gap: 8px; }
    .effect-row {
      display: grid;
      gap: 8px;
      padding: 9px 11px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #191b18;
    }
    .effect-row.is-locked { border-color: var(--warning); }
    .effect-head { display: flex; gap: 8px; align-items: center; }
    .effect-head select { flex: 1; }
    .effect-params { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; }
    .effect-params label { display: grid; gap: 3px; font-size: 11px; color: var(--muted); }
    .effect-params input[type="number"] { width: 84px; }
    .effect-condition { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; }
    .effect-condition label { display: grid; gap: 3px; font-size: 11px; color: var(--muted); }
    .effect-actions { display: flex; gap: 4px; }
    .effect-actions button { padding: 4px 8px; font-size: 11px; }
    .effect-glyph { color: var(--gold); font-size: 12px; letter-spacing: .12em; }
    .pool-membership { display: grid; gap: 5px; font-size: 12px; justify-items: start; }
    .pool-membership label { display: flex; gap: 7px; align-items: center; color: var(--ink); }
    .pool-membership .owned { color: var(--muted); font-size: 11px; }
    .pool-picker { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; }
    .pool-roster .slot .slot-actions { display: flex; gap: 4px; }
    .pool-roster .slot .slot-actions button { padding: 2px 7px; font-size: 11px; }

    @media (max-width: 1280px) {
      body { min-width: 920px; }
      .workspace { grid-template-columns: 230px minmax(440px, 1.25fr) minmax(310px, .9fr); }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">✦</div>
      <div>
        <h1>Fate Weaver 카드 아이디어 노트</h1>
        <p class="subtitle">저장소 JSON을 읽고 편집해 파일로 반영합니다.</p>
      </div>
    </div>
  </header>

  <main class="workspace repo-workspace" id="repo-workspace">
    <aside class="pane library-pane" aria-label="저장소 목록">
      <div class="pane-scroll">
        <div class="pane-header">
          <div class="pane-title">
            <strong>저장소</strong>
            <span class="count" id="repo-count">–</span>
          </div>
          <div class="repo-header-actions">
            <button type="button" id="repo-new-card">＋ 새 카드</button>
            <button type="button" id="repo-export" disabled>저장소에 반영</button>
            <button type="button" class="primary" id="repo-connect">폴더 연결</button>
          </div>
        </div>
        <div class="library-tools">
          <p class="repo-hint" id="repo-unsupported" hidden>
            이 브라우저는 폴더 연결을 지원하지 않습니다. Chrome이나 Edge로 열어 주세요.
          </p>
          <button type="button" id="repo-reload" disabled>저장소 다시 읽기</button>
          <div class="repo-tabs" role="group" aria-label="목록 종류">
            <button type="button" id="repo-tab-cards" class="mode-button is-active">카드</button>
            <button type="button" id="repo-tab-pools" class="mode-button">풀</button>
          </div>
          <label>
            검색
            <input id="repo-search" type="search" placeholder="이름 · id · 태그">
          </label>
          <label>
            필터
            <select id="repo-filter">
              <option value="all">전체</option>
              <option value="modified">수정됨만</option>
              <option value="conflict">충돌만</option>
              <option value="error">오류만</option>
              <option value="orphan">고아만</option>
            </select>
          </label>
        </div>
        <div class="repo-list" id="repo-list"></div>
      </div>
    </aside>

    <section class="pane editor-pane" aria-label="선택한 항목">
      <div class="pane-scroll">
        <div class="pane-header">
          <div class="pane-title"><strong id="repo-detail-title">선택된 항목 없음</strong></div>
        </div>
        <div class="repo-summary" id="repo-summary"></div>
        <p class="repo-hint" id="repo-pending-note" hidden></p>
        <div class="repo-problems" id="repo-problems"></div>
        <div class="repo-detail" id="repo-detail"></div>
      </div>
    </section>

    <aside class="pane preview-pane" aria-label="JSON 원문">
      <div class="pane-scroll">
        <div class="pane-header">
          <div class="pane-title"><strong id="repo-source-title">JSON 원문</strong></div>
          <button type="button" id="repo-source-toggle" hidden>저장소 ↔ 현재</button>
        </div>
        <pre class="json-preview" id="repo-source"></pre>
        <pre class="json-preview" id="repo-source-diff" hidden></pre>
      </div>
    </aside>
  </main>

  <dialog id="repo-export-dialog">
    <div class="dialog-body">
      <h2>저장소에 반영</h2>
      <div id="repo-export-summary"></div>
    </div>
    <div class="dialog-actions">
      <button type="button" class="ghost" data-repo-export-action="cancel">취소</button>
      <button type="button" class="primary" id="repo-export-confirm">반영</button>
    </div>
  </dialog>

  <script data-card-idea-core>
  (() => {
    "use strict";

    /// 생성된 저작 스키마를 폼이 쓸 형태로 바꾼다. 이 파일은 헤드리스 테스트가 만들므로
    /// 손으로 고치지 않는다 - 내용이 이상하면 dotnet test를 돌린다.
    function parseAuthoringSchema(text) {
      let raw;
      try {
        raw = JSON.parse(text);
      } catch (error) {
        throw new Error(`저작 스키마를 읽을 수 없습니다: ${error.message}`);
      }

      if (!Array.isArray(raw.effects) || !raw.effects.length) {
        throw new Error("저작 스키마에 effects 배열이 없습니다.");
      }
      if (!Array.isArray(raw.interventions) || !raw.interventions.length) {
        throw new Error("저작 스키마에 interventions 배열이 없습니다.");
      }
      if (!raw.cardFields || !Array.isArray(raw.cardFields.Execution)) {
        throw new Error("저작 스키마에 분류별 cardFields가 없습니다.");
      }

      /// 효과와 개입은 스키마에서 같은 모양이므로 같은 함수로 색인한다.
      function indexByKind(entries) {
        const byKind = {};
        const order = [];
        for (const entry of entries) {
          byKind[entry.kind] = Object.freeze({
            kind: entry.kind,
            label: entry.label,
            fields: Object.freeze(entry.fields.map((field) => Object.freeze({ ...field }))),
          });
          order.push(entry.kind);
        }

        return { byKind: Object.freeze(byKind), order: Object.freeze(order) };
      }

      const effects = indexByKind(raw.effects);
      const interventions = indexByKind(raw.interventions);
      const cardFields = {};
      for (const [category, names] of Object.entries(raw.cardFields)) {
        cardFields[category] = Object.freeze([...names]);
      }

      return Object.freeze({
        effects: effects.byKind,
        effectOrder: effects.order,
        interventions: interventions.byKind,
        interventionOrder: interventions.order,
        condition: Object.freeze({
          kinds: Object.freeze([...raw.condition.kinds]),
          fields: Object.freeze(raw.condition.fields.map((f) => Object.freeze({ ...f }))),
        }),
        cardFields: Object.freeze(cardFields),
        sides: Object.freeze([...raw.sides]),
        categories: Object.freeze([...raw.categories]),
        grades: Object.freeze([...raw.grades]),
        selectors: Object.freeze([...raw.selectors]),
        statusTargets: Object.freeze([...raw.statusTargets]),
      });
    }

    const SCHEMA_VERSION = 6;
    const STORAGE_KEY = "fate-weaver.card-idea-notebook";
    const CARD_REQUIRED_KEYS = Object.freeze(["id", "name", "side", "category"]);

    function emptyConditionValue() {
      return { kind: "None", n: 0, successEffectValue: 0, skipOnBasic: false };
    }

    /// 스키마가 아는 파라미터만 골라 담는다. 파일에 없는 키는 모델에도 넣지 않는다 -
    /// 생략된 기본값을 되살려 넣으면 왕복에서 없던 키가 생긴다.
    function readParams(entry, known) {
      const params = {};
      for (const field of known.fields) {
        if (Object.hasOwn(entry, field.name)) params[field.name] = entry[field.name];
      }

      return params;
    }

    /// 효과 하나를 모델 행으로. 스키마에 없는 kind는 원본을 통째로 들고 있는다(설계 §10.2).
    function readEffectEntry(entry, schema) {
      const kind = String(entry?.kind ?? "");
      const known = schema.effects[kind];
      if (!known) {
        return { kind, params: {}, condition: null, raw: entry };
      }

      let condition = null;
      if (entry.condition) {
        condition = { ...emptyConditionValue(), ...entry.condition };
      }

      return { kind, params: readParams(entry, known), condition, raw: null };
    }

    /// 개입 하나를 모델 행으로. 효과와 같되 조건이 없다 - 개입에는 조건 시스템이 없다.
    function readInterventionEntry(entry, schema) {
      const kind = String(entry?.kind ?? "");
      const known = schema.interventions[kind];
      if (!known) {
        return { kind, params: {}, raw: entry };
      }

      return { kind, params: readParams(entry, known), raw: null };
    }

    function readCardJson(text, schema) {
      let raw;
      try {
        raw = JSON.parse(text);
      } catch (error) {
        return { card: null, errors: [`JSON을 읽을 수 없습니다: ${error.message}`] };
      }

      const errors = [];
      for (const key of CARD_REQUIRED_KEYS) {
        if (!Object.hasOwn(raw, key)) errors.push(`필수 키 '${key}'가 없습니다.`);
      }
      if (errors.length) return { card: null, errors };

      /// 모르는 키의 기준이 분류마다 다르다 - 실행 카드의 intervention은 모르는 키다.
      const category = String(raw.category);
      const fields = schema.cardFields[category];
      if (!fields) {
        return { card: null, errors: [`모르는 카드 분류입니다: '${category}'`] };
      }

      const known = new Set(fields);
      const unknownKeys = [];
      const extra = {};
      for (const key of Object.keys(raw)) {
        if (known.has(key)) continue;
        unknownKeys.push(key);
        extra[key] = raw[key];
      }

      const card = {
        uid: repoUid(String(raw.id)),
        id: String(raw.id),
        name: String(raw.name),
        side: String(raw.side),
        category,
        energyCost: Number(raw.energyCost ?? 0),
        baseExecutionOrder: Number(raw.baseExecutionOrder ?? 0),
        effects: Array.isArray(raw.effects)
          ? raw.effects.map((entry) => readEffectEntry(entry, schema))
          : null,
        intervention: raw.intervention
          ? readInterventionEntry(raw.intervention, schema)
          : null,
        grade: String(raw.grade ?? schema.grades[0]),
        tags: Array.isArray(raw.tags) ? [...raw.tags] : null,
        unknownKeys,
        extra,
        base: text,
      };

      return { card, errors: [] };
    }

    const EDITABLE_CARD_FIELDS = Object.freeze([
      "id", "name", "side", "category", "energyCost", "baseExecutionOrder", "grade", "tags",
    ]);

    const NUMBER_CARD_FIELDS = Object.freeze(["energyCost", "baseExecutionOrder"]);

    /// 폼은 언제나 문자열을 준다. 화면마다 Number()를 부르면 한 곳이 빠졌을 때 조용히 문자열이
    /// 모델에 들어가고, 그러면 writeCardJson이 "1"을 써서 왕복이 깨진다.
    function toCardNumber(value) {
      const parsed = Number(String(value).trim());
      return Number.isFinite(parsed) ? parsed : 0;
    }

    /// 중복 태그를 여기서 지우지 않는다 - 검증기가 오류로 잡아 사용자가 고치는 편이,
    /// 입력이 조용히 달라지는 것보다 낫다.
    function parseTagsInput(text) {
      return String(text ?? "")
        .split(/[,\n]/)
        .map((tag) => tag.trim())
        .filter((tag) => tag.length > 0);
    }

    /// 필드 하나를 바꾼 새 카드. 제자리에서 고치지 않는 이유는 resolveCardState가 base와
    /// "지금 쓰면 나올 문자열"을 비교하기 때문이다 - 모델을 뒤집으면 비교 대상이 함께 바뀐다.
    function setCardField(card, field, value) {
      if (!EDITABLE_CARD_FIELDS.includes(field)) return card;

      if (field === "tags") return { ...card, tags: parseTagsInput(value) };
      if (NUMBER_CARD_FIELDS.includes(field)) return { ...card, [field]: toCardNumber(value) };
      return { ...card, [field]: String(value).trim() };
    }

    /// 빈 카드. 분류에 없는 쪽 필드도 채워 두는 이유는 설계 5 그대로다 - 편집 중 분류를
    /// 바꿔도 값이 사라지지 않아야 하고, 어차피 라이터가 분류별 키 목록만 내보낸다.
    function createCardModel({ schema, uid }) {
      return {
        uid,
        id: "",
        name: "",
        side: schema.sides[0],
        category: schema.categories[0],
        energyCost: 0,
        baseExecutionOrder: 0,
        effects: [],
        intervention: null,
        grade: schema.grades[0],
        tags: [],
        unknownKeys: [],
        extra: {},
        base: null,
      };
    }

    /// 스키마 필드 하나의 빈 값. writeCardJson의 isDefaultValue와 짝이 맞아야 한다 -
    /// 여기서 낸 값이 곧 "파일에서 생략되는 값"이다.
    function defaultParamValue(field) {
      if (field.type === "int") return 0;
      if (field.type === "bool") return false;
      if (field.type === "status") return "";
      return field.options[0];
    }

    function coerceParamValue(field, value) {
      if (field.type === "int") return toCardNumber(value);
      if (field.type === "bool") return value === true || value === "true";
      return String(value);
    }

    /// 효과와 개입이 스키마에서 같은 모양이라 한 함수가 둘을 만든다(계획 3.5의 결과).
    function emptyParams(spec) {
      const params = {};
      for (const field of spec.fields) params[field.name] = defaultParamValue(field);
      return params;
    }

    function replaceEffects(card, effects) {
      return { ...card, effects };
    }

    function addEffect(card, kind, schema) {
      const spec = schema.effects[kind];
      if (!spec) return card;

      return replaceEffects(card, [
        ...(card.effects ?? []),
        { kind, params: emptyParams(spec), condition: null, raw: null },
      ]);
    }

    function removeEffect(card, index) {
      const effects = [...(card.effects ?? [])];
      if (index < 0 || index >= effects.length) return card;

      effects.splice(index, 1);
      return replaceEffects(card, effects);
    }

    /// 파라미터를 얕은 복사한다. 같은 객체를 가리키면 한쪽을 고칠 때 둘 다 바뀐다.
    function duplicateEffect(card, index) {
      const effects = [...(card.effects ?? [])];
      const source = effects[index];
      if (!source) return card;

      effects.splice(index + 1, 0, {
        ...source,
        params: { ...source.params },
        condition: source.condition ? { ...source.condition } : null,
      });
      return replaceEffects(card, effects);
    }

    function moveEffect(card, from, to) {
      const effects = [...(card.effects ?? [])];
      if (from < 0 || from >= effects.length) return card;

      const [moved] = effects.splice(from, 1);
      effects.splice(Math.max(0, Math.min(to, effects.length)), 0, moved);
      return replaceEffects(card, effects);
    }

    /// 종류가 바뀌면 파라미터가 통째로 갈린다 - 계획 3.5가 파라미터를 액션에 소속시켰으므로
    /// 쓰지 않는 칸이 남을 자리가 없다. 조건은 효과 종류와 독립이라 유지한다.
    function setEffectKind(card, index, kind, schema) {
      const effects = [...(card.effects ?? [])];
      const current = effects[index];
      const spec = schema.effects[kind];
      if (!current || current.raw || !spec) return card;

      effects[index] = { kind, params: emptyParams(spec), condition: current.condition, raw: null };
      return replaceEffects(card, effects);
    }

    function setEffectParam(card, index, name, value, schema) {
      const effects = [...(card.effects ?? [])];
      const current = effects[index];
      if (!current || current.raw) return card;

      const field = schema.effects[current.kind]?.fields.find((entry) => entry.name === name);
      if (!field) return card;

      effects[index] = {
        ...current,
        params: { ...current.params, [name]: coerceParamValue(field, value) },
      };
      return replaceEffects(card, effects);
    }

    /// patch가 null이면 조건을 뗀다. 아니면 있는 조건 위에 얹는다 - 폼이 칸 하나씩 보내므로
    /// 나머지 칸이 유지되어야 한다.
    function setEffectCondition(card, index, patch) {
      const effects = [...(card.effects ?? [])];
      const current = effects[index];
      if (!current || current.raw) return card;

      if (patch === null) {
        effects[index] = { ...current, condition: null };
        return replaceEffects(card, effects);
      }

      const merged = { ...emptyConditionValue(), ...current.condition, ...patch };
      effects[index] = {
        ...current,
        condition: {
          kind: String(merged.kind),
          n: toCardNumber(merged.n),
          successEffectValue: toCardNumber(merged.successEffectValue),
          skipOnBasic: merged.skipOnBasic === true || merged.skipOnBasic === "true",
        },
      };
      return replaceEffects(card, effects);
    }

    /// 개입은 효과에서 조건을 뺀 것이고 행이 하나뿐이다. kind가 비면 뗀다.
    function setIntervention(card, kind, schema) {
      if (!kind) return { ...card, intervention: null };

      const spec = schema.interventions[kind];
      if (!spec) return card;
      return { ...card, intervention: { kind, params: emptyParams(spec), raw: null } };
    }

    function setInterventionParam(card, name, value, schema) {
      const current = card.intervention;
      if (!current || current.raw) return card;

      const field = schema.interventions[current.kind]?.fields
        .find((entry) => entry.name === name);
      if (!field) return card;

      return {
        ...card,
        intervention: {
          ...current,
          params: { ...current.params, [name]: coerceParamValue(field, value) },
        },
      };
    }

    /// 기본값이면 생략한다. C#의 DefaultValueHandling.Ignore를 그대로 옮긴 것이다.
    /// 배열은 null일 때만 생략한다 - string[]의 기본값이 null이라 []는 기본값이 아니다.
    function isDefaultValue(value, type, schema) {
      if (value === null || value === undefined) return true;
      if (Array.isArray(value)) return false;
      if (type === "int") return Number(value) === 0;
      if (type === "bool") return value !== true;
      if (type === "status") return String(value) === "";
      if (type === "enum") return value === schema[0];
      return false;
    }

    /// 파라미터 블록 하나를 파일 형태로. 효과와 개입이 스키마에서 같은 모양이라 함께 쓴다.
    function writeParams(entry, known) {
      const out = { kind: entry.kind };
      for (const field of known.fields) {
        const value = entry.params[field.name];
        const fallback = field.type === "enum" ? field.options : null;
        if (isDefaultValue(value, field.type, fallback)) continue;
        out[field.name] = value;
      }

      return out;
    }

    function writeEffectEntry(effect, schema) {
      if (effect.raw) return effect.raw;

      const entry = writeParams(effect, schema.effects[effect.kind]);
      if (effect.condition && effect.condition.kind !== schema.condition.kinds[0]) {
        const condition = { kind: effect.condition.kind };
        for (const field of schema.condition.fields) {
          const value = effect.condition[field.name];
          if (isDefaultValue(value, field.type, null)) continue;
          condition[field.name] = value;
        }
        entry.condition = condition;
      }

      return entry;
    }

    /// 개입은 효과에서 조건만 뺀 것이다.
    function writeInterventionEntry(intervention, schema) {
      if (intervention.raw) return intervention.raw;
      return writeParams(intervention, schema.interventions[intervention.kind]);
    }

    /// 카드 하나를 저장소 파일과 바이트가 같은 문자열로. 키 순서와 어떤 키가 나갈지는 둘 다
    /// 스키마의 분류별 cardFields가 정한다 - 그래서 실행 카드에 intervention이, 개입 카드에
    /// effects가 실릴 수 없다(설계 8, 계획 3.5의 타입 분리).
    function writeCardJson(card, schema) {
      const always = new Set(["side", "category"]);
      const enumOf = { side: schema.sides, category: schema.categories, grade: schema.grades };
      const typeOf = {
        id: "string", name: "string",
        side: "enum", category: "enum", grade: "enum",
        energyCost: "int", baseExecutionOrder: "int",
      };

      const fields = schema.cardFields[card.category];
      if (!fields) throw new Error(`모르는 카드 분류입니다: '${card.category}'`);

      const out = {};
      for (const key of fields) {
        if (key === "effects") {
          if (card.effects !== null) {
            out.effects = card.effects.map((effect) => writeEffectEntry(effect, schema));
          }
          continue;
        }
        if (key === "intervention") {
          if (card.intervention !== null) {
            out.intervention = writeInterventionEntry(card.intervention, schema);
          }
          continue;
        }
        if (key === "tags") {
          if (card.tags !== null) out.tags = [...card.tags];
          continue;
        }

        const value = card[key];
        const type = typeOf[key] ?? "string";
        if (!always.has(key) && isDefaultValue(value, type, enumOf[key] ?? null)) continue;
        out[key] = value;
      }

      for (const key of card.unknownKeys) {
        out[key] = card.extra[key];
      }

      return `${JSON.stringify(out, null, 2)}\n`;
    }

    const POOL_REQUIRED_KEYS = Object.freeze(["id", "cards"]);
    const POOL_FIELDS = Object.freeze(["id", "cards"]);

    function readPoolJson(text) {
      let raw;
      try {
        raw = JSON.parse(text);
      } catch (error) {
        return { pool: null, errors: [`JSON을 읽을 수 없습니다: ${error.message}`] };
      }

      const errors = [];
      for (const key of POOL_REQUIRED_KEYS) {
        if (!Object.hasOwn(raw, key)) errors.push(`필수 키 '${key}'가 없습니다.`);
      }
      if (errors.length) return { pool: null, errors };

      const known = new Set(POOL_FIELDS);
      const unknownKeys = [];
      const extra = {};
      for (const key of Object.keys(raw)) {
        if (known.has(key)) continue;
        unknownKeys.push(key);
        extra[key] = raw[key];
      }

      return {
        pool: {
          id: String(raw.id),
          cards: Array.isArray(raw.cards) ? raw.cards.map(String) : [],
          unknownKeys,
          extra,
          base: text,
        },
        errors: [],
      };
    }

    function writePoolJson(pool) {
      const out = { id: pool.id, cards: [...pool.cards] };
      for (const key of pool.unknownKeys) out[key] = pool.extra[key];
      return `${JSON.stringify(out, null, 2)}\n`;
    }

    /// 이미 있는 카드는 건너뛴다. 설계 7의 체크박스가 이미 소속된 풀을 비활성으로 두므로
    /// 정상 흐름에서는 일어나지 않지만, 여기서 막으면 UI가 실수해도 중복이 새로 생기지 않는다.
    /// 저장소에 이미 있던 중복은 건드리지 않는다 - 검증기가 오류로 잡고 사용자가 뺀다.
    function addCardsToPool(pool, cardIds) {
      const present = new Set(pool.cards);
      const added = [];
      for (const cardId of cardIds) {
        if (present.has(cardId)) continue;
        present.add(cardId);
        added.push(cardId);
      }

      return added.length ? { ...pool, cards: [...pool.cards, ...added] } : pool;
    }

    /// 인덱스로 뺀다. 풀에 같은 카드가 두 번 들어 있을 수 있으므로(설계 10.4가 지우지 않기로
    /// 했다) id로는 어느 쪽을 뺄지 정할 수 없다.
    function removeFromPool(pool, index) {
      if (index < 0 || index >= pool.cards.length) return pool;

      const cards = [...pool.cards];
      cards.splice(index, 1);
      return { ...pool, cards };
    }

    function moveInPool(pool, from, to) {
      if (from < 0 || from >= pool.cards.length) return pool;

      const cards = [...pool.cards];
      const [moved] = cards.splice(from, 1);
      cards.splice(Math.max(0, Math.min(to, cards.length)), 0, moved);
      return { ...pool, cards };
    }

    const CARD_ID_PATTERN = /^[a-z0-9_]+$/;

    /// 로더가 거부할 것을 내보내기 전에 잡는다(설계 9). 통과가 부팅 성공을 보장하지는 않지만,
    /// 실패가 드러나는 시점을 게임 실행에서 저작 중으로 당긴다.
    function validateContent({ cards, pools, statusKeys, schema }) {
      const errors = [];
      const warnings = [];
      const statuses = new Set(statusKeys);
      const fail = (id, message) => errors.push({ scope: "card", id, message });
      const warn = (id, message) => warnings.push({ scope: "card", id, message });

      const seenIds = new Set();
      const byId = new Map();
      for (const card of cards) {
        if (!card.id) fail(card.id, "id가 없습니다.");
        else if (!CARD_ID_PATTERN.test(card.id)) {
          fail(card.id, `id 형식이 잘못되었습니다. 소문자·숫자·밑줄만 씁니다: '${card.id}'`);
        } else if (seenIds.has(card.id)) {
          fail(card.id, `id가 중복입니다: '${card.id}'`);
        } else {
          seenIds.add(card.id);
        }
        byId.set(card.id, card);

        if (!card.name) fail(card.id, "이름이 없습니다.");

        for (const key of card.unknownKeys) {
          fail(card.id, `모르는 키 '${key}'가 있어 부팅이 이 카드를 거부합니다.`);
        }

        if (card.category === "Intervention") {
          if (!card.intervention) {
            fail(card.id, "개입 카드에는 개입 액션이 필요합니다.");
          } else if (card.intervention.raw) {
            fail(card.id, `노트북이 모르는 개입입니다: '${card.intervention.kind}'`);
          }
          continue;
        }

        const effects = card.effects ?? [];
        if (!effects.length) warn(card.id, "실행 카드인데 효과가 없습니다.");

        for (const effect of effects) {
          if (effect.raw) {
            fail(card.id, `노트북이 모르는 효과입니다: '${effect.kind}'`);
            continue;
          }

          const status = effect.params.status;
          if (status !== undefined && !statuses.has(status)) {
            fail(card.id, `등록되지 않은 상태 키입니다: '${status}'`);
          }
          if (effect.kind === "consume_status" && Number(effect.params.maxAmount ?? 0) < 1) {
            fail(card.id, "consume_status의 maxAmount는 1 이상이어야 합니다.");
          }
        }
      }

      const pooled = new Set();
      for (const pool of pools) {
        const seen = new Set();
        for (const cardId of pool.cards) {
          pooled.add(cardId);
          const card = byId.get(cardId);
          if (!card) {
            errors.push({ scope: "pool", id: pool.id, message: `없는 카드입니다: '${cardId}'` });
            continue;
          }
          if (seen.has(cardId)) {
            errors.push({ scope: "pool", id: pool.id, message: `카드가 중복입니다: '${cardId}'` });
            continue;
          }
          seen.add(cardId);

          if (card.grade === schema.grades[0]) {
            errors.push({ scope: "pool", id: pool.id, message: `'${cardId}'에 등급이 없습니다.` });
          }

          const tags = card.tags ?? [];
          if (!tags.length) {
            errors.push({ scope: "pool", id: pool.id, message: `'${cardId}'에 태그가 없습니다.` });
          }

          const seenTags = new Set();
          for (const tag of tags) {
            if (!String(tag).trim()) {
              errors.push({ scope: "pool", id: pool.id, message: `'${cardId}'에 빈 태그가 있습니다.` });
            } else if (seenTags.has(tag)) {
              errors.push({ scope: "pool", id: pool.id, message: `'${cardId}'에 중복 태그 '${tag}'가 있습니다.` });
            } else {
              seenTags.add(tag);
            }
          }
        }
      }

      for (const card of cards) {
        if (card.side === schema.sides[0] && !pooled.has(card.id)) {
          warn(card.id, "어느 풀에도 없습니다.");
        }
      }

      return { errors, warnings };
    }

    /// 카드 하나의 읽기 상태(설계 10.3). base는 마지막으로 저장소에서 읽은 원본이고,
    /// 지금 쓰면 나올 문자열과 base를 비교해 미반영 여부를 판정한다.
    function resolveCardState({ stored, pending, schema }) {
      if (!pending) return "missing";
      if (stored === null || stored === undefined) return "new";
      if (!pending.base) return "new";

      const current = writeCardJson(pending, schema);
      const dirty = current !== pending.base;
      const moved = stored !== pending.base;

      if (dirty && moved) return "conflict";
      if (dirty) return "modified";
      return "same";
    }

    /// 풀도 같은 계약이다. 스키마가 필요 없다는 것만 다르다 - 풀 직렬화는 키가 둘뿐이다.
    function resolvePoolState({ stored, pending }) {
      if (!pending) return "missing";
      if (stored === null || stored === undefined) return "new";
      if (!pending.base) return "new";

      const dirty = writePoolJson(pending) !== pending.base;
      const moved = stored !== pending.base;

      if (dirty && moved) return "conflict";
      if (dirty) return "modified";
      return "same";
    }

    /// LCS 기반 줄 diff. 카드 JSON은 길어야 60줄 남짓이라 O(n*m) 표로 충분하고, 외부 패키지를
    /// 들이지 않는다(규칙 14). 삭제를 추가보다 먼저 내보내 "무엇이 무엇으로 바뀌었나"로 읽힌다.
    function diffLines(base, current) {
      const left = base === null || base === undefined ? [] : String(base).split("\n");
      const right = String(current ?? "").split("\n");

      const table = Array.from({ length: left.length + 1 }, () => new Array(right.length + 1).fill(0));
      for (let i = left.length - 1; i >= 0; i -= 1) {
        for (let j = right.length - 1; j >= 0; j -= 1) {
          table[i][j] = left[i] === right[j]
            ? table[i + 1][j + 1] + 1
            : Math.max(table[i + 1][j], table[i][j + 1]);
        }
      }

      const rows = [];
      let i = 0;
      let j = 0;
      while (i < left.length && j < right.length) {
        if (left[i] === right[j]) {
          rows.push({ kind: "same", text: left[i] });
          i += 1;
          j += 1;
        } else if (table[i + 1][j] >= table[i][j + 1]) {
          rows.push({ kind: "remove", text: left[i] });
          i += 1;
        } else {
          rows.push({ kind: "add", text: right[j] });
          j += 1;
        }
      }
      while (i < left.length) {
        rows.push({ kind: "remove", text: left[i] });
        i += 1;
      }
      while (j < right.length) {
        rows.push({ kind: "add", text: right[j] });
        j += 1;
      }

      return { same: rows.every((row) => row.kind === "same"), rows };
    }

    /// 내보내기 계획(설계 12). 저장소 파일 이름 집합에서 이번에 쓸 이름을 빼면 남는 것이 둘이다 -
    /// 읽지 못해 제외한 것과, 아무도 대응하지 않게 된 것. 앞은 고쳐야 하고 뒤는 지워도 되므로
    /// 한 줄로 묶지 않는다.
    function exportPlan({
      cards, pools, storedCards, storedPools,
      cardStates, poolStates, readErrors, validation, schema,
    }) {
      const cardFile = (id) => `${id}.json`;
      const states = cardStates ?? new Map();
      const poolStateOf = poolStates ?? new Map();
      const problems = readErrors ?? [];

      const created = [];
      const updated = [];
      const unchanged = [];
      const cardWrites = [];
      const poolWrites = [];

      // 카드 id와 풀 id는 별개 네임스페이스다(각각 Cards/·Pools/ 폴더) - 같은 이름이 우연히
      // 겹쳐도 서로를 가리지 않도록 이름 집합·기록 집합을 카드용·풀용으로 나눠 계산한다.
      const storedCardNames = new Set((storedCards ?? []).map((card) => cardFile(card.id)));
      const storedPoolNames = new Set((storedPools ?? []).map((pool) => cardFile(pool.id)));
      const writtenCardNames = new Set();
      const writtenPoolNames = new Set();

      /// 신규와 수정을 상태가 아니라 '저장소에 그 이름의 파일이 있었나'로 가른다. id를 바꾼
      /// 카드는 상태가 modified지만 파일 이름이 새것이라 신규로 나가야 하고, 옛 이름은 아래에서
      /// 미참조가 된다.
      const record = (name, state, segments, storedNames, writtenNames, writeList, text) => {
        // 미참조 오판을 막기 위해 상태와 무관하게 '다뤘다'는 기록은 남긴다 - conflict도
        // 마찬가지다(아래에서 쓰기 목록에는 넣지 않는다).
        writtenNames.add(name);
        if (state === "same") {
          unchanged.push(name);
          return;
        }
        // conflict은 저장소와 내 변경 중 하나를 사용자가 고르게 하는 것이 설계 결정이다(설계
        // 12) - 자동으로 어느 한쪽을 덮어쓰지 않도록 쓰기 목록 밖에 둔다. blocked가 이미
        // 이유를 보고하므로 여기서는 조용히 건너뛴다.
        if (state === "conflict") return;
        writeList.push({ segments: [...segments, name], name, text });
        (storedNames.has(name) ? updated : created).push(name);
      };

      for (const card of cards ?? []) {
        record(
          cardFile(card.id), states.get(card.uid) ?? "same",
          CONTENT_PATHS.cards, storedCardNames, writtenCardNames, cardWrites,
          writeCardJson(card, schema));
      }

      for (const pool of pools ?? []) {
        record(
          cardFile(pool.id), poolStateOf.get(pool.id) ?? "same",
          CONTENT_PATHS.pools, storedPoolNames, writtenPoolNames, poolWrites,
          writePoolJson(pool));
      }

      const errorNames = problems.map((entry) => entry.name);
      const cardErrorNames = new Set(
        problems.filter((entry) => entry.scope === "card").map((entry) => entry.name));
      const poolErrorNames = new Set(
        problems.filter((entry) => entry.scope === "pool").map((entry) => entry.name));
      const unreferencedCards = [...storedCardNames]
        .filter((name) => !writtenCardNames.has(name) && !cardErrorNames.has(name));
      const unreferencedPools = [...storedPoolNames]
        .filter((name) => !writtenPoolNames.has(name) && !poolErrorNames.has(name));
      const unreferenced = [...unreferencedCards, ...unreferencedPools];

      const blocked = [];
      if (errorNames.length) {
        blocked.push(`읽기 오류 ${errorNames.length}개를 고쳐야 내보낼 수 있습니다.`);
      }
      const conflicts = [...states.values(), ...poolStateOf.values()]
        .filter((state) => state === "conflict").length;
      if (conflicts) blocked.push(`충돌 ${conflicts}개를 해결해야 내보낼 수 있습니다.`);
      const errorCount = (validation?.errors ?? []).length;
      if (errorCount) blocked.push(`검증 오류 ${errorCount}개를 고쳐야 내보낼 수 있습니다.`);

      const sorted = (list) => [...list].sort();
      const byName = (a, b) => a.name.localeCompare(b.name);
      return {
        // 카드를 풀보다 먼저 쓴다 - PoolContentLoader.Load가 부팅 시 cards.Catalog를 요구하고
        // (ContentBootstrap과 같은 이유, 설계 10.1), Unity가 폴더를 감시하며 즉시 재임포트하므로
        // 풀이 먼저 반영되면 아직 없는 카드를 참조한다는 경고가 일시적으로 뜬다.
        writes: [...cardWrites.sort(byName), ...poolWrites.sort(byName)],
        created: sorted(created),
        updated: sorted(updated),
        unchanged: sorted(unchanged),
        unreferenced: sorted(unreferenced),
        readErrors: sorted(errorNames),
        blocked,
        summaryLine:
          `신규 ${created.length} · 수정 ${updated.length} · 변경 없음 ${unchanged.length}`,
      };
    }

    /// 노트북이 아는 저장소 경로 넷(설계 3). 세그먼트 배열인 것은 File System Access API가
    /// 경로 문자열이 아니라 디렉터리 핸들을 한 칸씩 타고 내려가기 때문이다.
    const CONTENT_PATHS = Object.freeze({
      schema: Object.freeze(["Tools", "card-idea-notebook", "authoring-schema.json"]),
      statuses: Object.freeze(["Assets", "StreamingAssets", "Content", "Statuses"]),
      cards: Object.freeze(["Assets", "StreamingAssets", "Content", "Cards"]),
      pools: Object.freeze(["Assets", "StreamingAssets", "Content", "Pools"]),
    });

    /// 노트북 내부 식별자. id는 저작 중에 바뀌지만 uid는 바뀌지 않으므로, 선택과 미반영은
    /// uid에 매달린다(설계 5). 접두사를 붙이는 이유는 충돌이다 - 없으면 새 카드에
    /// 'vanguard_slash'라는 id를 주는 순간 저장소 카드의 uid와 겹친다.
    const REPO_UID_PREFIX = "file:";
    const NEW_UID_PREFIX = "new:";

    function repoUid(id) {
      return REPO_UID_PREFIX + id;
    }

    function newUid(sequence) {
      return NEW_UID_PREFIX + sequence;
    }

    function isNewUid(uid) {
      return String(uid).startsWith(NEW_UID_PREFIX);
    }

    /// 상태 파일에서 드롭다운 재료만 뽑는다(설계 11.5). 수명·성장치를 들고 있지 않는 것은
    /// 노트북이 상태를 쓰지 않기 때문이다 - 읽지 않는 값을 모델에 두면 언젠가 되쓰게 된다.
    function readStatusJson(text) {
      let raw;
      try {
        raw = JSON.parse(text);
      } catch (error) {
        return { status: null, errors: [`JSON을 읽을 수 없습니다: ${error.message}`] };
      }

      if (!raw || typeof raw !== "object" || !raw.key) {
        return { status: null, errors: ["필수 키 'key'가 없습니다."] };
      }

      return {
        status: {
          key: String(raw.key),
          displayName: String(raw.displayName ?? raw.key),
          base: text,
        },
        errors: [],
      };
    }

    /// 집계 결과를 화면이 다시 정렬하지 않도록 여기서 순서를 끝낸다.
    /// order === "value"면 값 오름차순(비용·순서), 아니면 개수 내림차순 후 값 오름차순(등급·태그).
    function countEntries(counts, order) {
      const entries = [];
      for (const [value, count] of counts) entries.push({ value, count });

      const byValue = (a, b) => (a.value < b.value ? -1 : a.value > b.value ? 1 : 0);
      entries.sort(order === "value" ? byValue : (a, b) => b.count - a.count || byValue(a, b));
      return entries;
    }

    /// 풀 하나를 집합으로 본 모습(설계 11.4). 없는 카드는 세지 않고 missing에 담는다 -
    /// 분포에 섞으면 집계가 거짓이 되고, 버리면 노트북을 열었다 닫는 것만으로 편성이 바뀐다.
    function poolDistribution({ pool, cardsById }) {
      const grades = new Map();
      const tags = new Map();
      const costs = new Map();
      const orders = new Map();
      const missing = [];
      const bump = (counts, key) => counts.set(key, (counts.get(key) ?? 0) + 1);

      for (const cardId of pool.cards) {
        const card = cardsById.get(cardId);
        if (!card) {
          missing.push(cardId);
          continue;
        }

        bump(grades, card.grade);
        for (const tag of card.tags ?? []) bump(tags, tag);
        bump(costs, card.energyCost);
        if (card.category === "Execution") bump(orders, card.baseExecutionOrder);
      }

      return {
        total: pool.cards.length,
        present: pool.cards.length - missing.length,
        missing,
        grades: countEntries(grades, "count"),
        tags: countEntries(tags, "count"),
        costs: countEntries(costs, "value"),
        orders: countEntries(orders, "value"),
      };
    }

    /// 카드 id로 소속 풀을 찾는 역방향 표. 참조는 풀→카드 단방향이므로(설계 7) 역방향이
    /// 필요한 화면은 이 표를 만들어 쓴다. 풀 안의 중복은 한 번만 센다 - 중복 자체는
    /// 검증기가 오류로 잡고, 소속 여부는 그것과 별개다.
    function poolMembership(pools) {
      const membership = new Map();
      for (const pool of pools) {
        for (const cardId of pool.cards) {
          const owners = membership.get(cardId);
          if (!owners) membership.set(cardId, [pool.id]);
          else if (!owners.includes(pool.id)) owners.push(pool.id);
        }
      }

      return membership;
    }

    const CARD_FILTERS = Object.freeze([
      "all", "modified", "conflict", "error", "orphan",
    ]);

    /// 검색은 이름·id·태그를 훑는다(설계 11.3). id가 파일명이자 풀이 참조하는 키라
    /// 이름만큼 자주 찾는 대상이다.
    function matchesQuery(card, query) {
      const needle = String(query ?? "").trim().toLocaleLowerCase();
      if (!needle) return true;

      const haystack = [card.name, card.id, ...(card.tags ?? [])];
      return haystack.some((value) => String(value).toLocaleLowerCase().includes(needle));
    }

    /// 고아는 "어느 풀에도 없는 아군 카드"다(설계 7). 적군 카드는 풀에 담기지 않으므로
    /// 고아일 수 없다 - 풀은 플레이어 캐릭터의 것이다.
    function matchesFilter(row, filter) {
      if (filter === "modified") return row.state === "modified";
      if (filter === "conflict") return row.state === "conflict";
      if (filter === "error") return row.hasError;
      if (filter === "orphan") return row.card.side === "Player" && row.pools.length === 0;
      return true;
    }

    /// 목록 한 줄이 알아야 하는 것을 카드마다 계산하고 걸러 준다. 화면은 이 배열만 반복하므로
    /// 검색·필터 규칙이 DOM을 모른다.
    /// states는 uid로, errorIds는 id로 색인한다 - 편집 상태는 카드를 따라가야 하고(id는
    /// 저작 중에 바뀐다) 검증은 파일 단위여서 로더와 같은 id로 봐야 한다.
    function cardListView({ cards, states, errorIds, membership, query, filter, poolId }) {
      const stateOf = states ?? new Map();
      const failing = errorIds ?? new Set();
      const owners = membership ?? new Map();
      const rows = [];

      for (const card of cards) {
        const row = {
          card,
          state: stateOf.get(card.uid) ?? "same",
          hasError: failing.has(card.id),
          pools: owners.get(card.id) ?? [],
        };

        if (poolId && !row.pools.includes(poolId)) continue;
        if (!matchesQuery(card, query)) continue;
        if (!matchesFilter(row, filter)) continue;
        rows.push(row);
      }

      return rows;
    }

    /// 읽은 직후 화면(설계 11.2)이 쓰는 수치. 읽기와 검증이 이미 끝난 결과만 세므로
    /// 이 함수는 파일도 스키마도 모른다.
    function contentSummary({ cards, pools, statuses, validation, cardStates, poolStates }) {
      const tally = (states) => {
        let conflict = 0;
        let pending = 0;
        for (const state of (states ?? new Map()).values()) {
          if (state === "conflict") conflict += 1;
          else if (state === "modified" || state === "new") pending += 1;
        }

        return { conflict, pending };
      };

      const card = tally(cardStates);
      const pool = tally(poolStates);

      return {
        counts: { cards: cards.length, pools: pools.length, statuses: statuses.length },
        errors: validation.errors.length,
        warnings: validation.warnings.length,
        conflicts: card.conflict + pool.conflict,
        pending: card.pending + pool.pending,
      };
    }

    /// 요약 두 줄. 문장을 코어에 두면 테스트가 문구까지 잠근다 - 화면 문자열이 흩어지면
    /// 바뀐 것을 아무도 모른다.
    function summaryLines(summary) {
      return [
        `카드 ${summary.counts.cards} · 풀 ${summary.counts.pools} `
        + `· 상태 ${summary.counts.statuses} 을 읽었습니다`,
        `오류 ${summary.errors} · 충돌 ${summary.conflicts} · 미반영 ${summary.pending}`,
      ];
    }

    /// STORAGE_KEY와 별개다. STORAGE_KEY는 이제 HANDLE_DB_NAME의 이름 공간 접두사로만 쓰이므로,
    /// 미반영은 자체 키와 자체 버전을 쓴다.
    const PENDING_STORAGE_KEY = "fate-weaver.card-idea-notebook.pending";
    const PENDING_VERSION = 1;

    function emptyPending() {
      return { version: PENDING_VERSION, cards: {}, pools: {} };
    }

    function readPending(storage) {
      const raw = storage.getItem(PENDING_STORAGE_KEY);
      if (!raw) return { pending: emptyPending(), errors: [] };

      let saved;
      try {
        saved = JSON.parse(raw);
      } catch (error) {
        return {
          pending: emptyPending(),
          errors: [`미반영 편집분을 읽을 수 없습니다: ${error.message}`],
        };
      }

      if (!saved || saved.version !== PENDING_VERSION) {
        return {
          pending: emptyPending(),
          errors: [`지원하지 않는 미반영 데이터 버전: ${saved?.version}`],
        };
      }

      return {
        pending: {
          version: PENDING_VERSION,
          cards: { ...(saved.cards ?? {}) },
          pools: { ...(saved.pools ?? {}) },
        },
        errors: [],
      };
    }

    /// 던지지 않는다. 용량 초과는 저작 중에 실제로 일어나고, 그때 편집을 막는 것보다
    /// 알리고 계속 쓰게 하는 편이 낫다 - 화면의 모델은 여전히 살아 있다.
    function writePending(storage, pending) {
      try {
        storage.setItem(PENDING_STORAGE_KEY, JSON.stringify(pending));
        return { persisted: true, error: "" };
      } catch (error) {
        return { persisted: false, error: String(error?.message ?? error) };
      }
    }

    function putPendingCard(pending, card) {
      return { ...pending, cards: { ...pending.cards, [card.uid]: card } };
    }

    function dropPendingCard(pending, uid) {
      const cards = { ...pending.cards };
      delete cards[uid];
      return { ...pending, cards };
    }

    function putPendingPool(pending, pool) {
      return { ...pending, pools: { ...pending.pools, [pool.id]: pool } };
    }

    function dropPendingPool(pending, id) {
      const pools = { ...pending.pools };
      delete pools[id];
      return { ...pending, pools };
    }

    /// 설계 10.1의 한 줄: 저장소 파일 + 미반영 편집분 = 화면에 보이는 것.
    /// 저장소에 있는 것은 대체하고, 저장소에 없는 미반영은 뒤에 덧붙인다.
    function applyPending({ cards, pools, pending }) {
      const usedCardUids = new Set();
      const mergedCards = cards.map((card) => {
        const edited = pending.cards[card.uid];
        if (!edited) return card;
        usedCardUids.add(card.uid);
        return edited;
      });
      for (const [uid, card] of Object.entries(pending.cards)) {
        if (!usedCardUids.has(uid)) mergedCards.push(card);
      }

      const usedPoolIds = new Set();
      const mergedPools = pools.map((pool) => {
        const edited = pending.pools[pool.id];
        if (!edited) return pool;
        usedPoolIds.add(pool.id);
        return edited;
      });
      for (const [id, pool] of Object.entries(pending.pools)) {
        if (!usedPoolIds.has(id)) mergedPools.push(pool);
      }

      return { cards: mergedCards, pools: mergedPools };
    }

    globalThis.CardIdeaNotebook = Object.freeze({
      PENDING_STORAGE_KEY,
      emptyPending,
      readPending,
      writePending,
      putPendingCard,
      dropPendingCard,
      putPendingPool,
      dropPendingPool,
      applyPending,
      repoUid,
      newUid,
      isNewUid,
      CONTENT_PATHS,
      readStatusJson,
      poolDistribution,
      poolMembership,
      CARD_FILTERS,
      cardListView,
      contentSummary,
      summaryLines,
      parseAuthoringSchema,
      readCardJson,
      EDITABLE_CARD_FIELDS,
      setCardField,
      parseTagsInput,
      createCardModel,
      addEffect,
      removeEffect,
      duplicateEffect,
      moveEffect,
      setEffectKind,
      setEffectParam,
      setEffectCondition,
      setIntervention,
      setInterventionParam,
      writeCardJson,
      readPoolJson,
      writePoolJson,
      addCardsToPool,
      removeFromPool,
      moveInPool,
      validateContent,
      resolveCardState,
      resolvePoolState,
      diffLines,
      exportPlan,
      emptyConditionValue,
      SCHEMA_VERSION,
      STORAGE_KEY,
    });
  })();
  </script>

  <script data-repo-ui>
  (() => {
    "use strict";

    const core = globalThis.CardIdeaNotebook;
    const byId = (id) => document.getElementById(id);
    const elements = {
      connect: byId("repo-connect"),
      reload: byId("repo-reload"),
      unsupported: byId("repo-unsupported"),
      count: byId("repo-count"),
      list: byId("repo-list"),
      tabCards: byId("repo-tab-cards"),
      tabPools: byId("repo-tab-pools"),
      search: byId("repo-search"),
      filter: byId("repo-filter"),
      summary: byId("repo-summary"),
      pendingNote: byId("repo-pending-note"),
      newCard: byId("repo-new-card"),
      problems: byId("repo-problems"),
      detailTitle: byId("repo-detail-title"),
      detail: byId("repo-detail"),
      sourceTitle: byId("repo-source-title"),
      source: byId("repo-source"),
      sourceToggle: byId("repo-source-toggle"),
      sourceDiff: byId("repo-source-diff"),
      export: byId("repo-export"),
      exportDialog: byId("repo-export-dialog"),
      exportSummary: byId("repo-export-summary"),
      exportConfirm: byId("repo-export-confirm"),
    };

    const HANDLE_DB_NAME = `${core.STORAGE_KEY}.handles`;
    const HANDLE_STORE = "handles";
    const REPO_HANDLE_KEY = "repoRoot";

    const repoStore = {
      connected: false,
      root: null,
      schema: null,
      statuses: [],
      cards: [],
      pools: [],
      storedCards: [],
      storedPools: [],
      storedCardText: new Map(),
      storedPoolText: new Map(),
      cardsById: new Map(),
      cardsByUid: new Map(),
      membership: new Map(),
      readErrors: [],
      validation: { errors: [], warnings: [] },
      cardStates: new Map(),
      poolStates: new Map(),
      message: "",
    };

    // 기존 UI 스크립트와 같은 저장소를 쓰되 키가 다르다. 같은 헬퍼를 복제하는 이유는 두
    // 스크립트가 서로를 참조하지 않게 하기 위해서다 - 계획 C가 옛 스크립트를 통째로 지운다.
    function openHandleDb() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(HANDLE_DB_NAME, 1);
        request.onupgradeneeded = () => request.result.createObjectStore(HANDLE_STORE);
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
        request.onblocked = () => reject(new Error("폴더 기억 저장소를 열 수 없습니다."));
      });
    }

    async function withHandleStore(mode, run) {
      const db = await openHandleDb();
      try {
        return await new Promise((resolve, reject) => {
          const request = run(db.transaction(HANDLE_STORE, mode).objectStore(HANDLE_STORE));
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });
      } finally {
        db.close();
      }
    }

    async function rememberRoot(handle) {
      try {
        await withHandleStore("readwrite", (store) => store.put(handle, REPO_HANDLE_KEY));
      } catch {
        /* 다음에 폴더를 다시 고르게 될 뿐 읽은 결과에는 영향이 없다. */
      }
    }

    async function recallRoot() {
      try {
        return (await withHandleStore("readonly", (store) => store.get(REPO_HANDLE_KEY))) ?? null;
      } catch {
        return null;
      }
    }

    /// 기억한 핸들은 새 탭에서 권한이 만료된다. 조용히 다시 묻지 않고 false를 돌려주면
    /// 호출부가 버튼을 누르게 한다 - 권한 요청은 사용자 제스처를 요구한다.
    /// 폴더는 처음부터 readwrite로 연다. 쓰기 시점에 승격하면 권한 요청이 사용자 제스처를
    /// 요구해 내보내기 흐름이 두 번 끊긴다. 대신 연결 단계에서 한 번만 묻는다.
    async function hasWritePermission(handle, interactive) {
      const options = { mode: "readwrite" };
      if ((await handle.queryPermission(options)) === "granted") return true;
      if (!interactive) return false;
      return (await handle.requestPermission(options)) === "granted";
    }

    async function directoryAt(root, segments) {
      let handle = root;
      for (const segment of segments) handle = await handle.getDirectoryHandle(segment);
      return handle;
    }

    async function fileTextAt(root, segments) {
      const directory = await directoryAt(root, segments.slice(0, -1));
      const handle = await directory.getFileHandle(segments[segments.length - 1]);
      return (await handle.getFile()).text();
    }

    /// 폴더의 *.json을 이름순으로 읽는다. 읽기에 실패한 파일은 던지지 않고 failures에 담는다 -
    /// 카드 한 장이 깨졌다고 도구가 열리지 않으면 그 카드를 고칠 수단도 사라진다(설계 10.2).
    async function readJsonFolder(root, segments) {
      const directory = await directoryAt(root, segments);
      const names = [];
      for await (const [name, entry] of directory.entries()) {
        if (entry.kind === "file" && name.endsWith(".json")) names.push(name);
      }
      names.sort();

      const files = [];
      const failures = [];
      for (const name of names) {
        try {
          const handle = await directory.getFileHandle(name);
          files.push({ name, text: await (await handle.getFile()).text() });
        } catch (error) {
          failures.push({ scope: "file", name, messages: [String(error?.message ?? error)] });
        }
      }

      return { files, failures };
    }

    /// 파싱 실패한 파일은 격리하고 나머지를 연다(설계 10.2). 읽는 순서는 상태 → 카드 → 풀이며,
    /// 풀이 카드 id 배열이라 카드에 의존하기 때문이다(설계 10.1, ContentBootstrap과 같은 이유).
    async function loadRepo(root) {
      const schema = core.parseAuthoringSchema(await fileTextAt(root, core.CONTENT_PATHS.schema));
      const readErrors = [];

      const statusFolder = await readJsonFolder(root, core.CONTENT_PATHS.statuses);
      const statuses = [];
      for (const file of statusFolder.files) {
        const { status, errors } = core.readStatusJson(file.text);
        if (status) statuses.push(status);
        else readErrors.push({ scope: "status", name: file.name, messages: errors, text: file.text });
      }

      const cardFolder = await readJsonFolder(root, core.CONTENT_PATHS.cards);
      const cards = [];
      for (const file of cardFolder.files) {
        const { card, errors } = core.readCardJson(file.text, schema);
        if (card) cards.push(card);
        else readErrors.push({ scope: "card", name: file.name, messages: errors, text: file.text });
      }

      const poolFolder = await readJsonFolder(root, core.CONTENT_PATHS.pools);
      const pools = [];
      for (const file of poolFolder.files) {
        const { pool, errors } = core.readPoolJson(file.text);
        if (pool) pools.push(pool);
        else readErrors.push({ scope: "pool", name: file.name, messages: errors, text: file.text });
      }

      readErrors.push(
        ...statusFolder.failures.map((entry) => ({ ...entry, text: null })),
        ...cardFolder.failures.map((entry) => ({ ...entry, text: null })),
        ...poolFolder.failures.map((entry) => ({ ...entry, text: null })));

      const cardsById = new Map();
      const cardsByUid = new Map();
      for (const card of cards) {
        cardsById.set(card.id, card);
        cardsByUid.set(card.uid, card);
      }

      const cardStates = new Map();
      for (const card of cards) {
        cardStates.set(card.uid,
          core.resolveCardState({ stored: card.base, pending: card, schema }));
      }

      const poolStates = new Map();
      for (const pool of pools) {
        poolStates.set(pool.id, core.resolvePoolState({ stored: pool.base, pending: pool }));
      }

      // refreshFromPending이 매번 원본에서 다시 쌓으려면 편집되지 않은 사본이 필요하다.
      // 원본 텍스트를 uid로 색인한다 - id로 하면 사용자가 id를 바꾸는 순간 원본을 못 찾아
      // resolveCardState가 그 카드를 '신규'로 잘못 판정한다.
      const storedCardText = new Map();
      for (const card of cards) storedCardText.set(card.uid, card.base);
      const storedPoolText = new Map();
      for (const pool of pools) storedPoolText.set(pool.id, pool.base);

      return {
        schema,
        statuses,
        cards,
        pools,
        storedCards: cards,
        storedPools: pools,
        storedCardText,
        storedPoolText,
        cardsById,
        cardsByUid,
        membership: core.poolMembership(pools),
        readErrors,
        validation: core.validateContent({
          cards, pools, statusKeys: statuses.map((status) => status.key), schema,
        }),
        cardStates,
        poolStates,
      };
    }

    let pending = core.emptyPending();
    let newCardSequence = 0;
    let pendingNote = "";

    function persistPending() {
      const result = core.writePending(window.localStorage, pending);
      pendingNote = result.persisted
        ? ""
        : `편집분을 브라우저에 저장하지 못했습니다: ${result.error}`;
    }

    /// 저장소에서 읽은 것 위에 미반영을 얹어 화면이 보는 목록을 다시 만든다(설계 10.1).
    /// 상태·색인·검증이 전부 이 결과에서 나오므로 편집 한 번마다 통째로 다시 계산한다 -
    /// 카드 26장 규모에서 부분 갱신은 이득보다 어긋날 위험이 크다.
    function refreshFromPending() {
      if (!repoStore.connected) return;

      const merged = core.applyPending({
        cards: repoStore.storedCards,
        pools: repoStore.storedPools,
        pending,
      });

      repoStore.cards = merged.cards;
      repoStore.pools = merged.pools;
      repoStore.cardsById = new Map(merged.cards.map((card) => [card.id, card]));
      repoStore.cardsByUid = new Map(merged.cards.map((card) => [card.uid, card]));
      repoStore.membership = core.poolMembership(merged.pools);
      repoStore.cardStates = new Map(merged.cards.map((card) => [
        card.uid,
        core.resolveCardState({
          stored: repoStore.storedCardText.get(card.uid) ?? null,
          pending: card,
          schema: repoStore.schema,
        }),
      ]));
      repoStore.poolStates = new Map(merged.pools.map((pool) => [
        pool.id,
        core.resolvePoolState({
          stored: repoStore.storedPoolText.get(pool.id) ?? null,
          pending: pool,
        }),
      ]));
      repoStore.validation = core.validateContent({
        cards: merged.cards,
        pools: merged.pools,
        statusKeys: repoStore.statuses.map((status) => status.key),
        schema: repoStore.schema,
      });
    }

    /// 편집 하나를 미반영에 반영한다. 저장소 원본과 같아지면 미반영에서 뺀다 -
    /// 되돌린 편집이 계속 "수정됨"으로 남으면 diff 요약이 거짓말을 한다.
    function applyCardEdit(next) {
      const stored = repoStore.storedCardText.get(next.uid) ?? null;
      const unchanged = stored !== null
        && core.writeCardJson(next, repoStore.schema) === stored;
      pending = unchanged
        ? core.dropPendingCard(pending, next.uid)
        : core.putPendingCard(pending, next);
      persistPending();
      refreshFromPending();
      selectWithTab("card", next.uid);
      render();
    }

    function applyPoolEdit(next) {
      const stored = repoStore.storedPoolText.get(next.id) ?? null;
      const unchanged = stored !== null && core.writePoolJson(next) === stored;
      pending = unchanged
        ? core.dropPendingPool(pending, next.id)
        : core.putPendingPool(pending, next);
      persistPending();
      refreshFromPending();
      selectWithTab("pool", next.id);
      render();
    }

    function newCard() {
      newCardSequence += 1;
      // 탭 전환은 applyCardEdit의 selectWithTab이 맡는다.
      applyCardEdit(core.createCardModel({
        schema: repoStore.schema,
        uid: core.newUid(newCardSequence),
      }));
    }

    function applyLoaded(root, loaded) {
      Object.assign(repoStore, loaded, { connected: true, root, message: "" });
      refreshFromPending();
      render();
    }

    function failWith(error) {
      repoStore.connected = false;
      repoStore.message = `저장소를 읽지 못했습니다: ${error?.message ?? error}`;
      render();
    }

    async function connectRepo() {
      try {
        const root = await window.showDirectoryPicker({
          id: "fateWeaverRepoRoot",
          mode: "readwrite",
        });
        await rememberRoot(root);
        applyLoaded(root, await loadRepo(root));
      } catch (error) {
        if (error?.name === "AbortError") return;
        failWith(error);
      }
    }

    /// §12: 노트북은 파일을 지우지 않는다. createWritable은 자르고 다시 쓰므로 덮어쓰기만 한다.
    async function writePlanFiles(root, writes) {
      for (const entry of writes) {
        const folder = await directoryAt(root, entry.segments.slice(0, -1));
        const handle = await folder.getFileHandle(entry.name, { create: true });
        const writable = await handle.createWritable();
        await writable.write(entry.text);
        await writable.close();
      }
    }

    function fileGroup(title, names, note) {
      if (!names.length) return null;
      const group = document.createElement("div");
      group.className = "export-group";
      const heading = document.createElement("h3");
      heading.textContent = note ? `${title} ${names.length} — ${note}` : `${title} ${names.length}`;
      const list = document.createElement("ul");
      for (const name of names) {
        const item = document.createElement("li");
        item.textContent = name;
        list.append(item);
      }
      group.append(heading, list);
      return group;
    }

    function renderExportSummary(plan, notice) {
      elements.exportSummary.replaceChildren();

      if (notice) {
        const line = document.createElement("p");
        line.className = "export-notice";
        line.textContent = notice;
        elements.exportSummary.append(line);
      }

      for (const reason of plan.blocked) {
        const line = document.createElement("p");
        line.className = "export-blocked";
        line.textContent = `⚠ ${reason}`;
        elements.exportSummary.append(line);
      }

      const line = document.createElement("p");
      line.className = "export-line";
      line.textContent = plan.summaryLine;
      elements.exportSummary.append(line);

      const groups = [
        fileGroup("신규", plan.created),
        fileGroup("수정", plan.updated),
        fileGroup("읽기 오류", plan.readErrors, "고쳐야 내보낼 수 있습니다"),
        fileGroup("미참조 파일", plan.unreferenced,
          "노트북은 지우지 않습니다. 그대로 두어도 됩니다"),
      ];
      for (const group of groups) if (group) elements.exportSummary.append(group);

      elements.exportConfirm.disabled = plan.blocked.length > 0 || plan.writes.length === 0;
    }

    let plannedExport = null;

    async function exportToRepo() {
      if (!repoStore.root) return;

      // 권한을 먼저 확보한다 - await가 사용자 제스처를 소진하므로 재읽기보다 앞이어야 한다.
      if (!(await hasWritePermission(repoStore.root, true))) {
        repoStore.message = "쓰기 권한을 얻지 못했습니다. 폴더 연결을 다시 눌러 주세요.";
        render();
        return;
      }

      // 내보내기 직전에 다시 읽는다(설계 10.1). 외부 편집을 덮어쓰는 사고를 여기서 막는다.
      try {
        Object.assign(repoStore, await loadRepo(repoStore.root), { connected: true });
      } catch (error) {
        failWith(error);
        return;
      }
      refreshFromPending();
      render();

      plannedExport = currentExportPlan();
      renderExportSummary(plannedExport);
      elements.exportDialog.showModal();
    }

    // exportToRepo 뒤에 둔다 - 함수 선언은 끌어올려지므로 위 호출과 무관하게 동작이 같고,
    // 재읽기(await loadRepo)가 계획 계산(core.exportPlan)보다 먼저라는 순서를 소스 텍스트에서도
    // 드러낸다(설계 10.1).
    function currentExportPlan() {
      return core.exportPlan({
        cards: repoStore.cards,
        pools: repoStore.pools,
        storedCards: repoStore.storedCards,
        storedPools: repoStore.storedPools,
        cardStates: repoStore.cardStates,
        poolStates: repoStore.poolStates,
        readErrors: repoStore.readErrors,
        validation: repoStore.validation,
        schema: repoStore.schema,
      });
    }

    /// 상태 맵에서 충돌 중인 항목의 식별자만 뽑아 정렬한다. 카드 uid와 풀 id는 별개
    /// 네임스페이스라 접두사로 갈라 둔다(exportPlan의 이름 집합 분리와 같은 이유).
    function conflictKeys(cardStates, poolStates) {
      const keys = [];
      for (const [uid, state] of cardStates ?? []) if (state === "conflict") keys.push(`card:${uid}`);
      for (const [id, state] of poolStates ?? []) if (state === "conflict") keys.push(`pool:${id}`);
      return keys.sort();
    }

    /// 계획 둘의 '같음'을 판정한다 - writes(파일 이름·내용)와 blocked만으로는 부족하다. blocked는
    /// 충돌을 개수로만 담으므로, 카드 A가 충돌에서 풀리고 동시에 카드 B가 충돌이 되면 개수가 같아
    /// 계획이 같아 보인다. 그래서 충돌 식별자 집합도 함께 비교한다.
    function samePlan(a, b, conflictsA, conflictsB) {
      const shape = (plan, conflicts) =>
        JSON.stringify({ writes: plan.writes, blocked: plan.blocked, conflicts });
      return shape(a, conflictsA) === shape(b, conflictsB);
    }

    /// 쓴 파일의 미반영을 비운다. 다시 읽으면 base가 방금 쓴 내용이 되므로 상태가 '저장소와 동일'로
    /// 내려가지만, 미반영을 남겨 두면 localStorage가 영원히 자라고 다음 세션에서 되살아난다.
    async function confirmExport() {
      if (!plannedExport || plannedExport.blocked.length) return;

      elements.exportConfirm.disabled = true;

      // plannedExport가 만들어진 시점(exportToRepo 또는 이전 재읽기)의 충돌 식별자를 남겨 둔다 -
      // 재읽기 뒤 samePlan이 이것과 새 충돌 식별자를 비교해 겉보기 개수가 같아도 대상이 바뀐
      // 것을 잡는다.
      const conflictsBefore = conflictKeys(repoStore.cardStates, repoStore.poolStates);

      // 다이얼로그가 떠 있는 동안 저장소가 다른 경로(에디터, git)로 바뀌었을 수 있다 - 쓰기
      // 직전 한 번 더 읽어 계획을 검증한다. 재읽기가 유일한 덮어쓰기 방어라는 설계 10.1의
      // 의도를 다이얼로그가 열려 있는 창에서도 지킨다.
      try {
        Object.assign(repoStore, await loadRepo(repoStore.root), { connected: true });
      } catch (error) {
        // 쓰기 실패 경로와 대칭으로 정리한다 - 다이얼로그를 열어 둔 채 확인 버튼만 죽이면
        // 안내 없는 데드락처럼 보인다. 닫아야 failWith가 남기는 메시지가 바깥 요약에 뜬다.
        plannedExport = null;
        elements.exportConfirm.disabled = false;
        elements.exportDialog.close();
        failWith(error);
        return;
      }
      refreshFromPending();
      render();

      const freshPlan = currentExportPlan();
      const conflictsAfter = conflictKeys(repoStore.cardStates, repoStore.poolStates);
      if (!samePlan(plannedExport, freshPlan, conflictsBefore, conflictsAfter)) {
        plannedExport = freshPlan;
        renderExportSummary(freshPlan, "저장소가 방금 바뀌었습니다. 달라진 내용을 확인하고 다시 눌러 주세요.");
        return;
      }

      try {
        await writePlanFiles(repoStore.root, plannedExport.writes);
      } catch (error) {
        repoStore.message =
          `저장소에 쓰지 못했습니다: ${error?.message ?? error}. ` +
          "일부 파일은 이미 반영되었을 수 있습니다. 저장소 다시 읽기로 확인해 주세요.";
        plannedExport = null;
        elements.exportConfirm.disabled = false;
        elements.exportDialog.close();
        render();
        return;
      }

      const written = plannedExport.writes.length;
      elements.exportDialog.close();
      plannedExport = null;
      pending = core.emptyPending();
      persistPending();

      try {
        Object.assign(repoStore, await loadRepo(repoStore.root), { connected: true });
        repoStore.message = `${written}개 파일을 저장소에 반영했습니다.`;
      } catch (error) {
        failWith(error);
        return;
      }
      refreshFromPending();
      render();
    }

    async function reloadRepo() {
      if (!repoStore.root) return;
      try {
        applyLoaded(repoStore.root, await loadRepo(repoStore.root));
      } catch (error) {
        failWith(error);
      }
    }

    const PROBLEM_LABELS = Object.freeze({
      card: "카드",
      pool: "풀",
      status: "상태",
      file: "파일",
      readError: "읽기 오류",
    });

    let selection = { scope: "", id: "" };
    let showDiff = false;

    /// 선택 대상에 맞는 탭으로 옮긴다. 중앙과 우측이 선택을 따라가므로(설계 11.1) 탭이
    /// 어긋나면 목록은 카드인데 상세는 풀인 화면이 나온다.
    function selectWithTab(scope, id) {
      // 토글과 읽기 오류 원문 초안은 보고 있는 항목에 대한 것이다 - 다른 항목으로 옮기면 꺼야
      // 한다. 같은 항목을 다시 고르는 경우(applyCardEdit의 편집 후 재선택 등)는 유지한다.
      if (scope !== selection.scope || id !== selection.id) {
        showDiff = false;
        rawDraft = "";
        rawError = "";
      }
      selection = { scope, id };
      if (scope !== "card" && scope !== "pool") return;

      tab = scope === "card" ? "cards" : "pools";
      elements.tabCards.classList.toggle("is-active", tab === "cards");
      elements.tabPools.classList.toggle("is-active", tab === "pools");
    }

    /// 요약의 문제 항목에서도 부르므로 탭을 함께 옮긴다 - 풀 오류를 눌렀는데 카드 목록이
    /// 그대로면 어디로 갔는지 알 수 없다.
    function selectEntry(scope, id) {
      selectWithTab(scope, id);
      render();
    }

    function problemButton({ level, scope, id, message }) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = `repo-problem is-${level}`;

      const where = document.createElement("span");
      where.className = "where";
      where.textContent = `${PROBLEM_LABELS[scope] ?? scope} · ${id}`;
      button.append(where);

      const text = document.createElement("span");
      text.textContent = message;
      button.append(text);

      button.addEventListener("click", () => {
        if (scope === "readError") {
          selectEntry("readError", id);
          return;
        }
        if (scope !== "card") {
          selectEntry(scope, id);
          return;
        }
        // 검증 오류는 카드 id로 온다. 선택은 uid를 쓰므로 여기서 옮긴다.
        const card = repoStore.cardsById.get(id)
          ?? repoStore.cardsById.get(String(id).replace(/\.json$/, ""));
        if (card) selectEntry("card", card.uid);
      });
      return button;
    }

    /// 읽기 오류 파일을 검증 오류보다 먼저 보여준다. 그 파일들은 아예 읽히지 않아 검증기가
    /// 보지도 못했으므로, 검증 오류 0이라고 안심하면 안 되기 때문이다(설계 10.2).
    function renderProblems() {
      elements.problems.replaceChildren();
      if (!repoStore.connected) return;

      for (const entry of repoStore.readErrors) {
        elements.problems.append(problemButton({
          level: "error",
          scope: "readError",
          id: entry.name,
          message: `${PROBLEM_LABELS[entry.scope] ?? entry.scope} · `
            + `${entry.messages.join(" ")} (읽지 못했습니다 · 고쳐야 내보낼 수 있습니다)`,
        }));
      }

      for (const error of repoStore.validation.errors) {
        elements.problems.append(problemButton({ level: "error", ...error }));
      }

      for (const warning of repoStore.validation.warnings) {
        elements.problems.append(problemButton({ level: "warning", ...warning }));
      }
    }

    function renderSummary() {
      elements.summary.replaceChildren();

      if (repoStore.message) {
        const line = document.createElement("p");
        line.textContent = repoStore.message;
        elements.summary.append(line);
        return;
      }
      if (!repoStore.connected) {
        const line = document.createElement("p");
        line.textContent = "폴더를 연결하세요.";
        elements.summary.append(line);
        return;
      }

      const summary = core.contentSummary({
        cards: repoStore.cards,
        pools: repoStore.pools,
        statuses: repoStore.statuses,
        validation: repoStore.validation,
        cardStates: repoStore.cardStates,
        poolStates: repoStore.poolStates,
      });

      for (const text of core.summaryLines(summary)) {
        const line = document.createElement("p");
        line.textContent = text;
        elements.summary.append(line);
      }

      // 상태가 0이면 폴더 선택이 잘못됐다는 신호다(설계 11.5).
      if (!repoStore.statuses.length) {
        const line = document.createElement("p");
        line.textContent = "상태를 하나도 읽지 못했습니다. 저장소 루트를 고른 것이 맞나요?";
        elements.summary.append(line);
      }
    }

    const STATE_BADGES = Object.freeze({
      same: "● 저장소와 동일",
      modified: "✎ 수정됨",
      new: "＋ 신규",
      conflict: "⚠ 충돌",
      missing: "− 저장소에만 있음",
    });
    const SIDE_LABELS = Object.freeze({ Player: "아군", Enemy: "적군" });
    const CATEGORY_LABELS = Object.freeze({ Execution: "실행", Intervention: "개입" });

    let tab = "cards";
    let query = "";
    let filter = "all";

    /// 검증 오류가 붙은 카드 id. 목록의 `오류만` 필터와 줄 배지가 같은 판정을 쓰도록
    /// 한 곳에서 만든다.
    function erroredCardIds() {
      const ids = new Set();
      for (const error of repoStore.validation.errors) {
        if (error.scope === "card") ids.add(error.id);
      }
      for (const entry of repoStore.readErrors) {
        if (entry.scope === "card") ids.add(entry.name.replace(/\.json$/, ""));
      }

      return ids;
    }

    function cardEntry(row) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "repo-entry";
      if (selection.scope === "card" && selection.id === row.card.uid) {
        button.classList.add("is-selected");
      }

      const headline = document.createElement("div");
      headline.className = "headline";
      const name = document.createElement("span");
      name.textContent = row.card.name || "(이름 없음)";
      const id = document.createElement("span");
      id.className = "id";
      id.textContent = row.card.id || "(id 없음)";
      headline.append(name, id);
      button.append(headline);

      const meta = document.createElement("div");
      meta.className = "meta";
      const parts = [
        SIDE_LABELS[row.card.side] ?? row.card.side,
        CATEGORY_LABELS[row.card.category] ?? row.card.category,
        `비용${row.card.energyCost}`,
      ];
      if (row.card.category === "Execution") parts.push(`순서${row.card.baseExecutionOrder}`);
      if (row.pools.length) parts.push(row.pools.join("·"));
      meta.textContent = parts.join(" · ");
      button.append(meta);

      const badge = document.createElement("div");
      badge.className = `badge is-${row.hasError ? "error" : row.state}`;
      const tags = (row.card.tags ?? []).join(" · ");
      badge.textContent = row.hasError
        ? `⚠ 오류${tags ? ` — ${tags}` : ""}`
        : `${STATE_BADGES[row.state] ?? row.state}${tags ? ` — ${tags}` : ""}`;
