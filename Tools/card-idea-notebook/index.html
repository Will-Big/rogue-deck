      button.append(badge);

      button.addEventListener("click", () => selectEntry("card", row.card.uid));
      return button;
    }

    function renderCardList() {
      const rows = core.cardListView({
        cards: repoStore.cards,
        states: repoStore.cardStates,
        errorIds: erroredCardIds(),
        membership: repoStore.membership,
        query,
        filter,
      });

      elements.count.textContent = `${rows.length}/${repoStore.cards.length}`;
      for (const row of rows) elements.list.append(cardEntry(row));
    }

    function fieldRow(term, value) {
      const row = document.createElement("div");
      const dt = document.createElement("dt");
      dt.textContent = term;
      const dd = document.createElement("dd");
      dd.textContent = value;
      row.append(dt, dd);
      return row;
    }

    /// 편집기는 계획 C다. 여기서는 카드가 무엇인지 읽을 수 있을 만큼만 보여주고,
    /// 실제 값의 원본은 우측 원문이 맡는다.
    function formField(label, control) {
      const wrap = document.createElement("label");
      const text = document.createElement("span");
      text.textContent = label;
      wrap.append(text, control);
      return wrap;
    }

    function textControl(value, onChange) {
      const input = document.createElement("input");
      input.type = "text";
      input.value = value;
      input.addEventListener("change", () => onChange(input.value));
      return input;
    }

    function numberControl(value, onChange) {
      const input = document.createElement("input");
      input.type = "number";
      input.step = "1";
      input.value = String(value);
      input.addEventListener("change", () => onChange(input.value));
      return input;
    }

    function selectControl(options, value, onChange) {
      const select = document.createElement("select");
      for (const option of options) {
        const node = document.createElement("option");
        node.value = option;
        node.textContent = option;
        select.append(node);
      }
      select.value = value;
      select.addEventListener("change", () => onChange(select.value));
      return select;
    }

    /// 위치 범위의 글리프 표기. 기존 도구에서 검증된 표기이고 방향 감각을 숫자보다 잘
    /// 전달하므로 selector 드롭다운 옆에 남긴다(설계 6).
    const SELECTOR_GLYPHS = Object.freeze({
      None: "",
      FrontOne: "◆━━━━",
      FrontTwo: "◆◆━━━",
      BackOne: "━━━━◆",
      BackTwo: "━━━◆◆",
      All: "━━━━━",
    });

    function statusLabel(key) {
      return repoStore.statuses.find((status) => status.key === key)?.displayName ?? key;
    }

    function checkboxControl(value, onChange) {
      const input = document.createElement("input");
      input.type = "checkbox";
      input.checked = value === true;
      input.addEventListener("change", () => onChange(input.checked));
      return input;
    }

    /// 스키마의 필드 타입 넷이 컨트롤 넷으로 간다(설계 6의 표). 효과와 개입이 같은 모양이라
    /// 이 함수 하나가 양쪽을 그린다.
    function paramControl(field, value, onChange) {
      if (field.type === "int") return numberControl(value ?? 0, onChange);
      if (field.type === "bool") return checkboxControl(value, onChange);
      if (field.type === "status") {
        const select = document.createElement("select");
        const none = document.createElement("option");
        none.value = "";
        none.textContent = "(없음)";
        select.append(none);
        for (const status of repoStore.statuses) {
          const node = document.createElement("option");
          node.value = status.key;
          node.textContent = `${statusLabel(status.key)} (${status.key})`;
          select.append(node);
        }
        select.value = value ?? "";
        select.addEventListener("change", () => onChange(select.value));
        return select;
      }

      return selectControl(field.options, value ?? field.options[0], onChange);
    }

    function paramsBlock(spec, params, onParam) {
      const block = document.createElement("div");
      block.className = "effect-params";
      for (const field of spec.fields) {
        const control = paramControl(field, params[field.name], (next) => onParam(field.name, next));
        block.append(formField(field.name, control));

        if (field.name === "selector") {
          const glyph = document.createElement("output");
          glyph.className = "effect-glyph";
          glyph.textContent = SELECTOR_GLYPHS[params.selector] ?? "";
          block.append(glyph);
        }
      }

      return block;
    }

    function conditionBlock(card, index, effect) {
      const wrap = document.createElement("details");
      wrap.open = Boolean(effect.condition);

      const summary = document.createElement("summary");
      summary.textContent = effect.condition ? `조건: ${effect.condition.kind}` : "조건";
      wrap.append(summary);

      const body = document.createElement("div");
      body.className = "effect-condition";
      const kinds = repoStore.schema.condition.kinds;
      const current = effect.condition ?? core.emptyConditionValue();

      body.append(formField("kind", selectControl(kinds, current.kind, (next) => {
        applyCardEdit(next === kinds[0]
          ? core.setEffectCondition(card, index, null)
          : core.setEffectCondition(card, index, { kind: next }));
      })));

      if (effect.condition) {
        for (const field of repoStore.schema.condition.fields) {
          body.append(formField(field.name, paramControl(
            field,
            current[field.name],
            (value) => applyCardEdit(
              core.setEffectCondition(card, index, { [field.name]: value })),
          )));
        }
      }

      wrap.append(body);
      return wrap;
    }

    function actionButton(label, onClick) {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = label;
      button.addEventListener("click", onClick);
      return button;
    }

    function effectRow(card, effect, index) {
      const row = document.createElement("div");
      row.className = effect.raw ? "effect-row is-locked" : "effect-row";

      const head = document.createElement("div");
      head.className = "effect-head";

      if (effect.raw) {
        const locked = document.createElement("span");
        locked.textContent = `해석 못 함: ${effect.kind}`;
        head.append(locked);
      } else {
        head.append(selectControl(
          repoStore.schema.effectOrder,
          effect.kind,
          (next) => applyCardEdit(core.setEffectKind(card, index, next, repoStore.schema)),
        ));
      }

      const actions = document.createElement("div");
      actions.className = "effect-actions";
      actions.append(
        actionButton("▲", () => applyCardEdit(core.moveEffect(card, index, index - 1))),
        actionButton("▼", () => applyCardEdit(core.moveEffect(card, index, index + 1))),
        actionButton("복제", () => applyCardEdit(core.duplicateEffect(card, index))),
        actionButton("삭제", () => applyCardEdit(core.removeEffect(card, index))),
      );
      head.append(actions);
      row.append(head);

      if (effect.raw) return row;

      row.append(paramsBlock(
        repoStore.schema.effects[effect.kind],
        effect.params,
        (name, value) => applyCardEdit(
          core.setEffectParam(card, index, name, value, repoStore.schema)),
      ));
      row.append(conditionBlock(card, index, effect));
      return row;
    }

    function renderEffectRows(card) {
      const section = document.createElement("div");
      section.className = "effect-list";
      (card.effects ?? []).forEach((effect, index) => {
        section.append(effectRow(card, effect, index));
      });

      const add = document.createElement("div");
      add.className = "effect-actions";
      add.append(selectControl(
        ["(효과 추가)", ...repoStore.schema.effectOrder],
        "(효과 추가)",
        (kind) => {
          if (kind !== "(효과 추가)") {
            applyCardEdit(core.addEffect(card, kind, repoStore.schema));
          }
        },
      ));
      section.append(add);
      return poolSection("효과", section);
    }

    /// 개입 섹션은 효과 행과 같은 컨트롤이며 행이 하나뿐이고 조건이 없다(설계 6).
    function renderInterventionRow(card) {
      const row = document.createElement("div");
      row.className = card.intervention?.raw ? "effect-row is-locked" : "effect-row";

      const head = document.createElement("div");
      head.className = "effect-head";

      // 해석 못 하는 개입은 종류 드롭다운을 내지 않는다. 효과 행과 같은 이유로, 고르는
      // 순간 보존하기로 한 원본이 사라진다(설계 10.2).
      if (card.intervention?.raw) {
        const locked = document.createElement("span");
        locked.textContent = `해석 못 함: ${card.intervention.kind}`;
        head.append(locked);
      } else {
        head.append(selectControl(
          ["(없음)", ...repoStore.schema.interventionOrder],
          card.intervention?.kind ?? "(없음)",
          (kind) => applyCardEdit(core.setIntervention(
            card, kind === "(없음)" ? "" : kind, repoStore.schema)),
        ));
      }
      row.append(head);

      if (card.intervention && !card.intervention.raw) {
        row.append(paramsBlock(
          repoStore.schema.interventions[card.intervention.kind],
          card.intervention.params,
          (name, value) => applyCardEdit(
            core.setInterventionParam(card, name, value, repoStore.schema)),
        ));
      }

      return poolSection("개입", row);
    }

    /// 소유권은 풀에 있다(설계 7). 이 컨트롤은 담기만 하고 위치 조정과 제거는 풀 화면에서만
    /// 된다. 이미 소속된 풀을 체크된 채 비활성으로 두면 한 컨트롤이 "현재 상태"와 "이번에 담을
    /// 곳"을 동시에 보여주고, 체크 해제로 제거되는 사고가 없다.
    function renderPoolMembership(card) {
      const block = document.createElement("div");
      block.className = "pool-membership";
      const owners = repoStore.membership.get(card.id) ?? [];
      const chosen = new Set();

      for (const pool of repoStore.pools) {
        const owned = owners.includes(pool.id);
        const label = document.createElement("label");
        const box = document.createElement("input");
        box.type = "checkbox";
        box.checked = owned;
        box.disabled = owned || !card.id;
        box.addEventListener("change", () => {
          if (box.checked) chosen.add(pool.id);
          else chosen.delete(pool.id);
        });

        const name = document.createElement("span");
        name.textContent = pool.id;
        label.append(box, name);

        if (owned) {
          const note = document.createElement("span");
          note.className = "owned";
          note.textContent = "(소속)";
          label.append(note);
        }
        block.append(label);
      }

      const submit = actionButton("선택한 풀에 담기", () => {
        for (const poolId of chosen) {
          const pool = repoStore.pools.find((entry) => entry.id === poolId);
          if (pool) applyPoolEdit(core.addCardsToPool(pool, [card.id]));
        }
      });
      submit.disabled = !card.id;
      block.append(submit);

      return poolSection("소속 풀", block);
    }

    /// 모르는 최상위 키를 가진 카드는 폼 대신 원문을 읽기 전용으로 보여준다(설계 11.3).
    /// 폼으로 열면 10.2가 보존하기로 한 것을 폼이 표현하지 못하는 만큼 망가뜨린다.
    /// 우측은 언제나 "지금 쓰면 나올 원문"을 보여준다. 저장소와 다를 때만 토글이 나오고,
    /// 토글을 켜면 diff가 원문 자리를 대신한다 - 둘을 동시에 띄우면 어느 쪽이 나갈 것인지
    /// 헷갈린다(설계 11.3).
    function renderSource({ title, stored, current }) {
      elements.sourceTitle.textContent = title;
      elements.source.textContent = current;

      const diff = core.diffLines(stored, current);
      elements.sourceToggle.hidden = diff.same;
      if (diff.same) showDiff = false;

      elements.sourceToggle.classList.toggle("is-active", showDiff);
      elements.source.hidden = showDiff;
      elements.sourceDiff.hidden = !showDiff;
      elements.sourceDiff.replaceChildren();
      if (!showDiff) return;

      for (const row of diff.rows) {
        const line = document.createElement("span");
        line.className = `diff-row is-${row.kind}`;
        line.textContent = `${row.kind === "add" ? "+" : row.kind === "remove" ? "-" : " "} ${row.text}`;
        elements.sourceDiff.append(line);
      }
    }

    function conflictBanner({ message, onStored, onMine }) {
      const banner = document.createElement("div");
      banner.className = "repo-conflict";

      const label = document.createElement("strong");
      label.textContent = "⚠ 충돌";
      const text = document.createElement("span");
      text.textContent = message;
      banner.append(label, text);

      const stored = document.createElement("button");
      stored.type = "button";
      stored.textContent = "저장소 것으로 되돌리기";
      stored.addEventListener("click", onStored);

      const mine = document.createElement("button");
      mine.type = "button";
      mine.className = "primary";
      mine.textContent = "내 변경 유지";
      mine.addEventListener("click", onMine);

      banner.append(stored, mine);
      return banner;
    }

    /// 되돌리기는 미반영에서 빼는 것과 같다. 저장소 원문은 이미 storedCardText에 새로 들어와
    /// 있으므로, 미반영만 사라지면 화면이 저장소 것을 그대로 보여준다(설계 10.3).
    function revertCardToStored(card) {
      pending = core.dropPendingCard(pending, card.uid);
      persistPending();
      refreshFromPending();
      render();
    }

    /// 유지는 base를 새 저장소 원문으로 갈아 끼우는 것이다. 그래야 충돌이 '수정됨'으로 내려가고,
    /// 우측 diff가 "내 것 ↔ 새 저장소 원문"을 비교한다.
    function keepCardMine(card) {
      const stored = repoStore.storedCardText.get(card.uid) ?? null;
      pending = core.putPendingCard(pending, { ...card, base: stored });
      persistPending();
      refreshFromPending();
      render();
    }

    function revertPoolToStored(pool) {
      pending = core.dropPendingPool(pending, pool.id);
      persistPending();
      refreshFromPending();
      render();
    }

    function keepPoolMine(pool) {
      const stored = repoStore.storedPoolText.get(pool.id) ?? null;
      pending = core.putPendingPool(pending, { ...pool, base: stored });
      persistPending();
      refreshFromPending();
      render();
    }

    let rawDraft = "";
    let rawError = "";

    /// 읽기 오류 파일은 폼으로 열 수 없다 - 폼이 표현하지 못하는 것을 망가뜨린다(설계 10.2).
    /// 대신 원문을 직접 고치게 하고, 다시 파싱해 성공할 때만 모델로 올린다. 이렇게 하지 않으면
    /// "반드시 고쳐야 내보낼 수 있다"는 규칙이 노트북 밖으로 나가야만 풀리는 막다른 길이 된다.
    function renderReadErrorDetail(entry) {
      elements.detailTitle.textContent = `읽기 오류 · ${entry.name}`;

      // text === null은 파일을 아예 열지 못한 경우(scope: "file")다. 비교할 원문이 없으므로
      // stored·current를 둘 다 빈 문자열로 넘겨 diff.same이 true가 되게 한다 - 그래야 의미 없는
      // "저장소 ↔ 현재" 토글이 뜨지 않는다. scope 검사보다 반드시 먼저 온다.
      if (entry.text === null) {
        renderSource({ title: entry.name, stored: "", current: "" });

        const box = document.createElement("div");
        box.className = "repo-raw-editor";

        const why = document.createElement("p");
        why.className = "repo-raw-error";
        why.textContent = entry.messages.join(" ");
        box.append(why);

        const note = document.createElement("p");
        note.className = "repo-readonly";
        note.textContent = "파일을 열지 못해 원문을 보여줄 수 없습니다."
          + " 파일 권한을 확인한 뒤 저장소 다시 읽기를 눌러 주세요.";
        box.append(note);
        elements.detail.append(box);
        return;
      }

      renderSource({ title: entry.name, stored: entry.text, current: entry.text });

      const box = document.createElement("div");
      box.className = "repo-raw-editor";

      const why = document.createElement("p");
      why.className = "repo-raw-error";
      why.textContent = entry.messages.join(" ");
      box.append(why);

      // 상태(Statuses/) JSON은 이 노트북의 저작 범위 밖이다(스펙 §15) - id/name/side/category가
      // 없어 core.readCardJson으로 보내면 항상 엉뚱한 오류만 낸다. 편집 UI 대신 읽기 전용 안내만 준다.
      if (entry.scope === "status") {
        const note = document.createElement("p");
        note.className = "repo-readonly";
        note.textContent = "상태 파일은 이 노트북에서 편집하지 않습니다(읽기 전용)."
          + " 저장소에서 직접 고친 뒤 저장소 다시 읽기를 눌러 주세요.";
        box.append(note);
        elements.detail.append(box);
        return;
      }

      const area = document.createElement("textarea");
      area.spellcheck = false;
      area.value = rawDraft || entry.text;
      area.addEventListener("input", () => { rawDraft = area.value; });
      box.append(area);

      if (rawError) {
        const failed = document.createElement("p");
        failed.className = "repo-raw-error";
        failed.textContent = rawError;
        box.append(failed);
      }

      const apply = document.createElement("button");
      apply.type = "button";
      apply.className = "primary";
      apply.textContent = "고친 원문 적용";
      apply.addEventListener("click", () => applyRawRepair(entry, area.value));
      box.append(apply);

      elements.detail.append(box);
    }

    /// 승격에 성공하면 base를 '원래의 깨진 원문'으로 둔다. 그래야 상태가 '수정됨'으로 되어
    /// 내보내기에 포함되고, 우측 diff가 무엇을 고쳤는지 보여준다.
    function applyRawRepair(entry, text) {
      // status(읽기 전용 안내만 제공)와 file(원문 자체가 없음)은 이 경로로 불릴 UI가 없다.
      // 방어적으로 막아 둔다 - core.readCardJson·readPoolJson 둘 다 이 두 scope를 검증하지 않는다.
      if (entry.scope !== "card" && entry.scope !== "pool") return;

      if (entry.scope === "pool") {
        const { pool, errors } = core.readPoolJson(text);
        if (!pool) { rawError = errors.join(" "); render(); return; }
        repoStore.storedPoolText.set(pool.id, entry.text);
        repoStore.storedPools = [...repoStore.storedPools, { ...pool, base: entry.text }];
        repoStore.readErrors = repoStore.readErrors.filter((row) => row.name !== entry.name);
        rawDraft = "";
        rawError = "";
        pending = core.putPendingPool(pending, { ...pool, base: entry.text });
        persistPending();
        refreshFromPending();
        selectWithTab("pool", pool.id);
        render();
        return;
      }

      const { card, errors } = core.readCardJson(text, repoStore.schema);
      if (!card) { rawError = errors.join(" "); render(); return; }

      repoStore.storedCardText.set(card.uid, entry.text);
      repoStore.storedCards = [...repoStore.storedCards, { ...card, base: entry.text }];
      repoStore.readErrors = repoStore.readErrors.filter((row) => row.name !== entry.name);
      rawDraft = "";
      rawError = "";
      pending = core.putPendingCard(pending, { ...card, base: entry.text });
      persistPending();
      refreshFromPending();
      selectWithTab("card", card.uid);
      render();
    }

    function renderCardDetail(card) {
      elements.detailTitle.textContent = `${card.name || "(이름 없음)"} · ${card.id || "(id 없음)"}`;
      renderSource({
        title: card.id ? `Cards/${card.id}.json` : "Cards/(id 없음).json",
        stored: repoStore.storedCardText.get(card.uid) ?? null,
        current: core.writeCardJson(card, repoStore.schema),
      });

      if (card.unknownKeys.length) {
        const note = document.createElement("p");
        note.className = "repo-readonly";
        note.textContent = `모르는 키 ${card.unknownKeys.join(" · ")}가 있어 편집할 수 없습니다.`
          + " 부팅이 이 카드를 거부하므로 그 키를 손으로 지운 뒤 다시 읽어 주세요.";
        elements.detail.append(note);
        return;
      }

      if ((repoStore.cardStates.get(card.uid) ?? "same") === "conflict") {
        elements.detail.append(conflictBanner({
          message: "이 카드를 편집하는 동안 저장소 파일도 바뀌었습니다.",
          onStored: () => revertCardToStored(card),
          onMine: () => keepCardMine(card),
        }));
      }

      const form = document.createElement("div");
      form.className = "repo-form";
      const edit = (field) => (value) => applyCardEdit(core.setCardField(card, field, value));

      const identity = document.createElement("div");
      identity.className = "row";
      identity.append(
        formField("id", textControl(card.id, edit("id"))),
        formField("이름", textControl(card.name, edit("name"))),
      );
      form.append(identity);

      const classify = document.createElement("div");
      classify.className = "row";
      classify.append(
        formField("진영", selectControl(repoStore.schema.sides, card.side, edit("side"))),
        formField("분류",
          selectControl(repoStore.schema.categories, card.category, edit("category"))),
      );
      form.append(classify);

      const numbers = document.createElement("div");
      numbers.className = "row";
      numbers.append(formField("비용", numberControl(card.energyCost, edit("energyCost"))));
      if (card.category === "Execution") {
        numbers.append(formField("실행 순서",
          numberControl(card.baseExecutionOrder, edit("baseExecutionOrder"))));
      }
      form.append(numbers);

      const meta = document.createElement("div");
      meta.className = "row";
      meta.append(
        formField("등급", selectControl(repoStore.schema.grades, card.grade, edit("grade"))),
        formField("태그", textControl((card.tags ?? []).join(", "), edit("tags"))),
      );
      form.append(meta);

      elements.detail.append(form);
      if (card.category === "Execution") elements.detail.append(renderEffectRows(card));
      else elements.detail.append(renderInterventionRow(card));
      elements.detail.append(renderPoolMembership(card));
    }

    function poolEntry(pool) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "repo-entry";
      if (selection.scope === "pool" && selection.id === pool.id) {
        button.classList.add("is-selected");
      }

      const headline = document.createElement("div");
      headline.className = "headline";
      const name = document.createElement("span");
      name.textContent = pool.id;
      const count = document.createElement("span");
      count.className = "id";
      count.textContent = `${pool.cards.length}장`;
      headline.append(name, count);
      button.append(headline);

      const state = repoStore.poolStates.get(pool.id) ?? "same";
      const badge = document.createElement("div");
      badge.className = `badge is-${state}`;
      badge.textContent = STATE_BADGES[state] ?? state;
      button.append(badge);

      button.addEventListener("click", () => selectEntry("pool", pool.id));
      return button;
    }

    function renderPoolList() {
      elements.count.textContent = String(repoStore.pools.length);
      for (const pool of repoStore.pools) elements.list.append(poolEntry(pool));
    }

    function distributionRow(term, entries, format) {
      return fieldRow(term, entries.length
        ? entries.map((entry) => format(entry)).join(" · ")
        : "없음");
    }

    function poolSection(title, body) {
      const section = document.createElement("section");
      section.className = "pool-section";
      const heading = document.createElement("h4");
      heading.textContent = title;
      section.append(heading, body);
      return section;
    }

    /// 편성 · 분포 · 오류 세 덩어리(설계 11.4). 분포가 편성 바로 아래인 이유는 풀이 후보
    /// 집합이라 밸런스를 집합 단위로 봐야 하기 때문이다.
    /// 드래그 재정렬과 담기·빼기는 계획 C다.
    function renderPoolDetail(pool) {
      const distribution = core.poolDistribution({ pool, cardsById: repoStore.cardsById });
      elements.detailTitle.textContent = `${pool.id} · ${distribution.total}장`;

      if ((repoStore.poolStates.get(pool.id) ?? "same") === "conflict") {
        elements.detail.append(conflictBanner({
          message: "이 풀을 편집하는 동안 저장소 파일도 바뀌었습니다.",
          onStored: () => revertPoolToStored(pool),
          onMine: () => keepPoolMine(pool),
        }));
      }

      const roster = document.createElement("div");
      roster.className = "pool-roster";
      pool.cards.forEach((cardId, index) => {
        const card = repoStore.cardsById.get(cardId);
        const slot = document.createElement("div");
        slot.className = card ? "slot" : "slot is-missing";

        const order = document.createElement("span");
        order.className = "index";
        order.textContent = String(index + 1);

        const label = document.createElement("span");
        label.textContent = card ? `${card.name}  ${cardId}` : `⚠ 없는 카드  ${cardId}`;

        const tail = document.createElement("span");
        tail.className = "tail";
        tail.textContent = card ? [card.grade, ...(card.tags ?? [])].join(" · ") : "";

        const slotActions = document.createElement("div");
        slotActions.className = "slot-actions";
        slotActions.append(
          actionButton("▲", () => applyPoolEdit(core.moveInPool(pool, index, index - 1))),
          actionButton("▼", () => applyPoolEdit(core.moveInPool(pool, index, index + 1))),
          actionButton("빼기", () => applyPoolEdit(core.removeFromPool(pool, index))),
        );

        slot.append(order, label, tail, slotActions);
        roster.append(slot);
      });

      // 담기는 맨 끝에 붙이기만 한다. 소유권이 풀에 있으므로 이쪽이 본진이다(설계 7).
      const picker = document.createElement("div");
      picker.className = "pool-picker";
      const candidates = repoStore.cards
        .filter((card) => card.side === repoStore.schema.sides[0])
        .filter((card) => card.id && !pool.cards.includes(card.id));
      picker.append(selectControl(
        ["(카드 담기)", ...candidates.map((card) => card.id)],
        "(카드 담기)",
        (cardId) => {
          if (cardId !== "(카드 담기)") {
            applyPoolEdit(core.addCardsToPool(pool, [cardId]));
          }
        },
      ));
      roster.append(picker);

      elements.detail.append(poolSection("편성", roster));

      const stats = document.createElement("dl");
      stats.className = "pool-distribution";
      stats.append(
        distributionRow("등급", distribution.grades, (e) => `${e.value} ${e.count}`),
        distributionRow("태그", distribution.tags, (e) => `${e.value} ${e.count}`),
        distributionRow("비용", distribution.costs, (e) => `${e.value}: ${e.count}`),
        distributionRow("순서", distribution.orders, (e) => `${e.value}: ${e.count}`),
      );
      elements.detail.append(poolSection("분포", stats));

      const failures = repoStore.validation.errors
        .filter((error) => error.scope === "pool" && error.id === pool.id);
      const problems = document.createElement("div");
      problems.className = "repo-problems";
      if (failures.length) {
        for (const error of failures) {
          problems.append(problemButton({ level: "error", ...error }));
        }
      } else {
        const none = document.createElement("p");
        none.textContent = "없음";
        problems.append(none);
      }
      elements.detail.append(poolSection("오류", problems));

      renderSource({
        title: `Pools/${pool.id}.json`,
        stored: repoStore.storedPoolText.get(pool.id) ?? null,
        current: core.writePoolJson(pool),
      });
    }

    function render() {
      elements.export.disabled = !repoStore.connected;
      elements.reload.disabled = !repoStore.connected;
      elements.list.replaceChildren();
      elements.detail.replaceChildren();
      elements.detailTitle.textContent = "선택된 항목 없음";
      elements.sourceTitle.textContent = "JSON 원문";
      elements.source.textContent = "";
      elements.source.hidden = false;
      elements.sourceDiff.replaceChildren();
      elements.sourceDiff.hidden = true;
      elements.sourceToggle.hidden = true;

      // renderSummary는 이른 반환이 있으므로 여기서 갱신한다 - 연결 전에도 미반영 복원
      // 실패는 알려야 한다.
      elements.pendingNote.hidden = !pendingNote;
      elements.pendingNote.textContent = pendingNote;

      renderSummary();
      renderProblems();

      if (!repoStore.connected) {
        elements.count.textContent = "–";
        return;
      }

      if (tab === "cards") renderCardList();
      else renderPoolList();

      if (selection.scope === "card") {
        const card = repoStore.cardsByUid.get(selection.id);
        if (card) renderCardDetail(card);
      }
      if (selection.scope === "pool") {
        const pool = repoStore.pools.find((entry) => entry.id === selection.id);
        if (pool) renderPoolDetail(pool);
      }
      if (selection.scope === "readError") {
        const entry = repoStore.readErrors.find((row) => row.name === selection.id);
        if (entry) renderReadErrorDetail(entry);
      }
    }

    /// 탭은 좌측 목록만 바꾼다. 중앙과 우측은 선택한 대상을 따라가므로(설계 11.1)
    /// 탭을 옮길 때 선택을 비운다 - 카드 탭에서 고른 카드가 풀 탭에 남으면 어긋난다.
    function setTab(next) {
      tab = next;
      selection = { scope: "", id: "" };
      elements.tabCards.classList.toggle("is-active", next === "cards");
      elements.tabPools.classList.toggle("is-active", next === "pools");
      render();
    }

    async function restoreRoot() {
      const root = await recallRoot();
      if (!root) return;

      // 권한이 살아 있을 때만 조용히 읽는다. 만료됐으면 버튼을 누르게 둔다.
      if (!(await hasWritePermission(root, false))) {
        repoStore.root = root;
        repoStore.message = "폴더 권한이 만료되었습니다. 폴더 연결을 다시 눌러 주세요.";
        render();
        return;
      }

      try {
        applyLoaded(root, await loadRepo(root));
      } catch (error) {
        failWith(error);
      }
    }

    if (typeof window.showDirectoryPicker !== "function") {
      elements.unsupported.hidden = false;
      elements.connect.disabled = true;
    } else {
      elements.connect.addEventListener("click", connectRepo);
      restoreRoot();
    }

    elements.reload.addEventListener("click", reloadRepo);
    elements.sourceToggle.addEventListener("click", () => {
      showDiff = !showDiff;
      render();
    });
    elements.newCard.addEventListener("click", newCard);
    elements.search.addEventListener("input", () => {
      query = elements.search.value;
      render();
    });
    elements.filter.addEventListener("change", () => {
      filter = elements.filter.value;
      render();
    });
    elements.tabCards.addEventListener("click", () => setTab("cards"));
    elements.tabPools.addEventListener("click", () => setTab("pools"));
    elements.export.addEventListener("click", exportToRepo);
    elements.exportConfirm.addEventListener("click", confirmExport);
    elements.exportDialog.addEventListener("click", (event) => {
      if (event.target.closest("[data-repo-export-action]")) {
        elements.exportDialog.close();
      }
    });
    // 네이티브 Escape로 닫는 경로는 위 클릭 핸들러를 거치지 않는다 - close 이벤트에서 한 번 더
    // 정리해 어느 경로로 닫혀도 plannedExport가 남지 않게 한다. confirmExport의 성공·실패 경로도
    // close()를 부르지만 그때는 이미 plannedExport를 null로 정리한 뒤라 무해하다.
    elements.exportDialog.addEventListener("close", () => {
      plannedExport = null;
    });

    const restored = core.readPending(window.localStorage);
    pending = restored.pending;
    if (restored.errors.length) pendingNote = restored.errors.join(" ");

    render();
  })();
  </script>
</body>
</html>
